 prière au Temple (Actes 3:1).", "La nuit est divisée en veilles, c’est-à-dire en tours de garde. L’Ancien Testament en compte trois (Juges 7:19). Au temps de Jésus, on en compte quatre, à la manière romaine : le soir, minuit, le chant du coq et le matin (Marc 13:35). Jésus marche sur l’eau à la quatrième veille, peu avant l’aube (Matthieu 14:25)."], "u": ["Jour : du coucher du soleil au coucher du soleil suivant.", "Heure : un douzième de la journée de lumière. Sa durée varie selon la saison.", "Troisième heure : environ 9 h. Sixième heure : environ 12 h. Neuvième heure : environ 15 h.", "Première veille, « le soir » : environ 18 h à 21 h.", "Deuxième veille, « minuit » : environ 21 h à 24 h.", "Troisième veille, « le chant du coq » : environ 24 h à 3 h.", "Quatrième veille, « le matin » : environ 3 h à 6 h.", "Semaine : sept jours, dont le septième est le sabbat. Les mois suivent la lune (voir la leçon sur les mois)."], "p2": ["Ces repères sont approximatifs : comme les heures dépendent du lever et du coucher du soleil, leur durée changeait au fil de l’année. Quand l’Évangile précise une heure, il donne surtout une idée du moment de la journée."], "d": [["Veille", "Tour de garde de la nuit. Il y en avait trois, puis quatre à l’époque romaine."], ["Sabbat", "Septième jour de la semaine, du vendredi soir au samedi soir."], ["Troisième heure", "Environ neuf heures du matin."]], "l": [["Lire Genèse 1:1-5", "GEN", 1, 1], ["Lire Jean 11:9", "JOH", 11, 9], ["Lire Actes 2:15", "ACT", 2, 15]]}, {"t": "De l’Alpha à l’Oméga : l’alphabet grec", "ic": "Α", "p": ["Le Nouveau Testament a été écrit en grec. Cet alphabet compte vingt-quatre lettres. Dans l’Apocalypse, Jésus déclare : « Je suis l’alpha et l’oméga, le premier et le dernier, le commencement et la fin » (Apocalypse 22:13). L’alpha est la première lettre, l’oméga la dernière : Jésus est présenté comme celui qui contient tout, du début à la fin.", "En grec, les noms des lettres n’ont généralement pas de sens. Ils viennent de l’alphabet phénicien, très proche de l’hébreu, dont chaque lettre portait le nom d’un objet de la vie courante. Voici chaque lettre grecque, avec la lettre hébraïque dont elle vient et son sens d’origine. Les Grecs ont ajouté eux-mêmes Phi, Khi, Psi et Oméga."], "u": ["Apocalypse 1:8, 21:6 et 22:13 : Jésus, « l’alpha et l’oméga ».", "Matthieu 5:18 : Jésus parle d’un « iota », la plus petite lettre.", "Des mots grecs à retenir : agapè (amour), metanoia (repentance), baptizô (baptiser)."], "d": [["Alpha · Α α", "Vient de l’aleph (« bœuf »). Première lettre : le commencement."], ["Bêta · Β β", "Vient de beth (« maison »). Avec alpha, il donne le mot « alphabet »."], ["Gamma · Γ γ", "Vient de guimel (« chameau »)."], ["Delta · Δ δ", "Vient de daleth (« porte »)."], ["Epsilon · Ε ε", "Vient de hé. Son nom signifie « e simple »."], ["Zêta · Ζ ζ", "Vient de zayin, dont le sens est discuté (peut-être « arme »)."], ["Êta · Η η", "Vient de heth (« enclos, barrière »)."], ["Thêta · Θ θ", "Vient de teth, dont le sens est discuté."], ["Iota · Ι ι", "Vient de yod (« main »). La plus petite lettre : Matthieu 5:18."], ["Kappa · Κ κ", "Vient de kaph (« paume de la main »)."], ["Lambda · Λ λ", "Vient de lamed (« aiguillon »)."], ["Mu · Μ μ", "Vient de mem (« eau »)."], ["Nu · Ν ν", "Vient de noun (« poisson »)."], ["Xi · Ξ ξ", "Vient de samekh (« appui, soutien »)."], ["Omicron · Ο ο", "Vient de ayin (« œil »). Son nom signifie « petit o »."], ["Pi · Π π", "Vient de pé (« bouche »)."], ["Rhô · Ρ ρ", "Vient de resh (« tête »)."], ["Sigma · Σ σ ς", "Vient de shin (« dent »). Cette origine est un peu discutée."], ["Tau · Τ τ", "Vient de tav (« signe, marque »)."], ["Upsilon · Υ υ", "Vient de vav (« crochet, clou »). Son nom signifie « u simple »."], ["Phi · Φ φ", "Ajoutée par les Grecs. Pas d’équivalent hébreu."], ["Khi · Χ χ", "Ajoutée par les Grecs. C’est la première lettre de Christos (Christ)."], ["Psi · Ψ ψ", "Ajoutée par les Grecs. Elle commence le mot psychê, « âme »."], ["Oméga · Ω ω", "Ajoutée par les Grecs. Son nom signifie « grand o ». Dernière lettre : la fin."]], "l": [["Lire Apocalypse 22:13", "REV", 22, 13], ["Lire Matthieu 5:18", "MAT", 5, 18]]}, {"t": "De l’Aleph au Tav : l’alphabet hébreu", "ic": "א", "p": ["L’Ancien Testament a été écrit presque entièrement en hébreu. Cet alphabet compte vingt-deux lettres, toutes des consonnes, et il se lit de droite à gauche. Chaque lettre porte un nom qui correspond, à l’origine, à un objet de la vie courante : un bœuf, une maison, une main… On pense que les lettres venaient d’abord de petits dessins de ces objets.", "La Bible utilise parfois ces lettres pour structurer un texte. Le Psaume 119 est un poème de vingt-deux strophes de huit versets : les versets de chaque strophe commencent par la même lettre, de l’aleph au tav. Il en va de même de plusieurs chapitres du livre des Lamentations. L’alphabet entier exprime ici la plénitude : on loue Dieu « de A à Z »."], "u": ["Les sens ci-dessous viennent de l’origine en images des lettres. Ils sont traditionnels et plusieurs sont discutés par les spécialistes.", "Jésus parle d’un iota (la lettre yod, la plus petite) et d’un trait de lettre (Matthieu 5:18).", "La Genèse commence par la lettre beth : bereshit, « au commencement »."], "d": [["Aleph · א", "« Bœuf ». Première lettre."], ["Beth · ב", "« Maison »."], ["Guimel · ג", "« Chameau »."], ["Daleth · ד", "« Porte »."], ["Hé · ה", "Sens discuté (« fenêtre » ou « souffle »)."], ["Vav · ו", "« Crochet, clou ». C’est aussi le petit mot « et »."], ["Zayin · ז", "Sens discuté (peut-être « arme »)."], ["Heth · ח", "« Enclos, barrière »."], ["Teth · ט", "Sens discuté (« panier » ou « serpent »)."], ["Yod · י", "« Main ». La plus petite lettre."], ["Kaph · כ", "« Paume de la main »."], ["Lamed · ל", "« Aiguillon » (le bâton qui guide les bœufs)."], ["Mem · מ", "« Eau »."], ["Noun · נ", "« Poisson » (ou « pousse »)."], ["Samekh · ס", "« Appui, soutien »."], ["Ayin · ע", "« Œil » (ou « source »)."], ["Pé · פ", "« Bouche »."], ["Tsadé · צ", "Sens discuté (peut-être « hameçon »)."], ["Qoph · ק", "Sens discuté (peut-être « arrière de la tête »)."], ["Resh · ר", "« Tête »."], ["Shin · ש", "« Dent »."], ["Tav · ת", "« Signe, marque ». Dernière lettre."]], "l": [["Lire Psaume 119", "PSA", 119, 1], ["Lire Genèse 1:1", "GEN", 1, 1], ["Lire Matthieu 5:18", "MAT", 5, 18]]}, {"t": "Conseils pour bien commencer", "u": ["Commencez par un Évangile, Marc ou Jean, puis lisez les Actes des apôtres. Ajoutez un psaume de temps en temps.", "Lisez des passages entiers plutôt que des versets isolés : le contexte aide à comprendre.", "Servez-vous des surligneurs et des notes de l’application pour garder ce qui vous frappe et vos questions.", "Comparez les deux traductions proposées quand un passage vous paraît difficile.", "N’hésitez pas à en parler avec des personnes qui connaissent bien la Bible."], "ic": "💡"}, {"t": "Vocabulaire", "d": [["Canon", "La liste des livres reconnus comme faisant partie de la Bible."], ["Alliance", "Un engagement entre Dieu et son peuple ; le mot « testament » en est la traduction."], ["Évangile", "Mot grec qui signifie « bonne nouvelle » ; il désigne aussi les quatre récits de la vie de Jésus."], ["Épître", "Une lettre ; le Nouveau Testament en contient vingt et une."], ["Psaume", "Un chant ou une prière en poésie ; le livre des Psaumes en compte 150."], ["Prophète", "Quelqu’un qui transmet un message de la part de Dieu."], ["Manuscrit", "Un texte copié à la main ; la Bible nous est parvenue par des milliers de manuscrits."], ["Septante", "La traduction grecque de la Bible hébraïque, commencée avant notre ère."], ["Vulgate", "La traduction latine de la Bible faite par Jérôme."], ["Verset", "Une petite division d’un chapitre, numérotée pour retrouver un passage."], ["Pâque", "Fête juive de la sortie d’Égypte. « Pâques » : la fête chrétienne de la résurrection."], ["Salut", "Délivrance du péché et de la mort, offerte par Dieu en Jésus-Christ."], ["Repenta a.querySelectorAll(".vt").forEach(e=>{const tog=()=>{const n=+e.dataset.n;S.sel=S.sel===n?null:n;render()};e.onclick=tog;e.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();tog()}}});
a.querySelectorAll(".sq").forEach(b=>b.onclick=()=>setHl(b.dataset.r,+b.dataset.c));
on("#ns",()=>saveNote($("#ns").dataset.r,$("#nt1").value));on("#nd",()=>delNote($("#nd").dataset.r));
a.querySelectorAll(".lk").forEach(b=>b.onclick=()=>{const [bk,c,v]=b.dataset.r.split(".");S.book=bk;S.chap=+c;S.jump=+v;S.sel=+v;S.nv=false;S.res=null;S.hl="";loadChap()});on("#tcb",()=>{S.toc=false;S.tocCh=null;render()});
a.querySelectorAll(".chb").forEach(b=>b.onclick=async()=>{const bk=b.dataset.b,c=+b.dataset.c;S.tocCh={book:bk,chap:c,verses:null};render();const {data}=await sb.from("versets").select("verset").eq("version",S.ver).eq("livre",bk).eq("chapitre",c).order("verset");if(S.tocCh&&S.tocCh.book===bk&&S.tocCh.chap===c){S.tocCh.verses=(data||[]).map(x=>x.verset);render();const e=document.getElementById("vtab");if(e)e.scrollIntoView({block:"nearest"})}});
a.querySelectorAll(".vb2").forEach(b=>b.onclick=()=>{S.book=b.dataset.b;S.chap=+b.dataset.c;S.jump=+b.dataset.v;S.hl="";S.res=null;S.toc=false;S.tocCh=null;S.sel=null;scrollTo(0,0);loadChap()});
on("#tco",()=>{S.book=$("#tco").dataset.b;S.chap=+$("#tco").dataset.c;S.hl="";S.res=null;S.toc=false;S.tocCh=null;S.sel=null;S.jump=0;scrollTo(0,0);loadChap()});
on("#th",()=>{const cur=S.theme||"dark";S.theme=cur==="dark"?"light":"dark";save();theme()});
on("#out",()=>sb.auth.signOut());
on("#fg",async()=>{const m=$("#email").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$("#e-email").textContent=t("eMail");return}
await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});st(t("sent"))});
a.querySelectorAll(".f").forEach(b=>b.onclick=async()=>{const ref=b.dataset.r,has=S.fav.includes(ref);
const r=has?await sb.from("favoris").delete().eq("user_id",S.user.id).eq("ref",ref):await sb.from("favoris").insert({user_id:S.user.id,ref});
if(r.error)return;S.fav=has?S.fav.filter(x=>x!==ref):[...S.fav,ref];b.setAttribute("aria-pressed",!has);b.textContent=has?"☆":"★"});
const sf=$("#sf");if(sf)sf.onsubmit=e=>{e.preventDefault();doSearch($("#q").value)};
on("#bk0",()=>{S.res=null;render()});on("#pv",()=>step(-1));on("#nx",()=>step(1));
const bk=$("#bk");if(bk)bk.onchange=()=>{S.book=bk.value;S.chap=1;S.hl="";S.sel=null;loadChap()};
const cp=$("#cp");if(cp)cp.onchange=()=>{S.chap=+cp.value;S.hl="";S.sel=null;loadChap()};
const vv=$("#vv");if(vv)vv.onchange=()=>{const n=vv.value;if(!n)return;const e=document.getElementById("v"+n);if(e){e.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),2200)}};
const vr=$("#vr");if(vr)vr.onchange=()=>{S.ver=vr.value;S.verPick=true;S.hl="";S.jump=0;scrollTo(0,0);loadChap()};
a.querySelectorAll(".rs").forEach(r=>{const go2=()=>{S.book=r.dataset.b;S.chap=+r.dataset.c;S.jump=+r.dataset.v;S.hl=S.q;S.q="";loadChap()};r.onclick=go2;r.onkeydown=e=>{if(e.key==="Enter")go2()}});
if(S.screen==="reg")initCb(a,d.country||"");
const f=$("#f");if(f){f.onsubmit=e=>{e.preventDefault();submit(a,st)}}}
const MAIL=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
async function submit(a,st){const v=id=>a.querySelector("#"+id),E={},clear=ks=>ks.forEach(k=>{const e=v("e-"+k);if(e)e.textContent=E[k]?t(E[k]):""});
st("");const email=v("email")?v("email").value.trim():"";
if(S.screen==="login"){if(!MAIL.test(email))E.email="eMail";if(!v("pw").value)E.pw="ePw";clear(["email","pw"]);if(Object.keys(E).length)return;
const {error}=await sb.auth.signInWithPassword({email,password:v("pw").value});if(error)st(t("bad"));return}
if(S.screen==="newpw"){if(v("pw").value.length<8){E.pw="ePw";clear(["pw"]);return}
const {error}=await sb.auth.updateUser({password:v("pw").value});if(error){st(t("fail"));return}st(t("done"));setTimeout(()=>enterBible(),900);return}
if(!v("name").value.trim())E.name="eName";if(!v("country").value)E.country="eCountry";
const ag=+v("age").value;if(!(ag>=1&&ag<=120))E.age="eAge";const sx=a.querySelector("input[name=sex]:checked");if(!sx)E.sex="eSex";const tel=v("tel").value.replace(/[\s.\-()]/g,"");if(tel&&!/^\d{4,14}$/.test(tel))E.tel="eTel";if(!MAIL.test(email))E.email="eMail";
if(v("pw").value.length<8)E.pw="ePw";if(!v("cgu").checked)E.cgu="eCgu";
clear(["name","country","age","sex","tel","email","pw","cgu"]);const first=Object.keys(E)[0];if(first){(first==="sex"?a.querySelector("input[name=sex]"):v(first==="country"?"cq":first)).focus();return}
const {data,error}=await sb.auth.signUp({email,password:v("pw").value,options:{emailRedirectTo:location.origin+location.pathname,data:{pseudo:v("name").value.trim(),country:v("country").value,age:ag,sex:sx.value,phone:tel?"+"+DC[v("country").value]+tel:""}}});
if(error){st(t("fail"));return}
if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){st(t("exists"));return}
try{localStorage.setItem("edsp_seen","1")}catch(e){}
if(!data.session){S.email=email;S.screen="check";render()}}
async function loadFav(){const [f,h,n]=await Promise.all([sb.from("favoris").select("ref"),sb.from("surlignages").select("ref,couleur"),sb.from("notes").select("ref,texte")]);S.fav=(f.data||[]).map(r=>r.ref);S.hlm=Object.fromEntries((h.data||[]).map(r=>[r.ref,r.couleur]));S.nt=Object.fromEntries((n.data||[]).map(r=>[r.ref,r.texte]))}
render();
if(CFG)sb.auth.onAuthStateChange((ev,ses)=>setTimeout(async()=>{
if(ev==="PASSWORD_RECOVERY"){S.user=ses.user;S.screen="newpw";render();return}
if(ses){S.user=ses.user;await loadFav();if(S.screen!=="bible"&&S.screen!=="newpw"){if(seen(ses.user))enterBible();else{S.screen="welcome";render()}}}
else{S.user=null;S.fav=[];S.hlm={};S.nt={};S.sel=null;S.nv=false;let seenAny=false;try{seenAny=!!localStorage.getItem("edsp_seen")}catch(e){}S.screen=seenAny?"login":"reg";render()}},0));
setTimeout(()=>{const s=document.getElementById("splash");s.style.opacity=0;setTimeout(()=>s.hidden=true,500)},1200);
</script>
