const INTRO={"GEN": {"r": "Premier livre de la Bible, il raconte les origines : la création du monde, l’humanité, le déluge, puis l’histoire d’Abraham, d’Isaac, de Jacob et de Joseph.", "a": "Attribué par la tradition à Moïse.", "e": "Récits des origines, puis des patriarches (traditionnellement au IIe millénaire av. J.-C.) ; la mise par écrit est discutée.", "t": "Création ; alliance ; promesse faite à Abraham ; famille et bénédiction.", "p": "Chapitres 1 à 11 : les origines. Chapitres 12 à 50 : Abraham, Isaac, Jacob, Joseph."}, "EXO": {"r": "Raconte la libération du peuple d’Israël hors d’Égypte, le don de la Loi au Sinaï et la construction du tabernacle, la tente du culte.", "a": "Attribué par la tradition à Moïse.", "e": "Événements placés traditionnellement au XVe ou au XIIIe siècle av. J.-C., selon les approches.", "t": "Libération ; alliance ; dix commandements ; présence de Dieu au milieu du peuple.", "p": "1 à 18 : la sortie d’Égypte. 19 à 24 : l’alliance au Sinaï. 25 à 40 : le tabernacle et le culte."}, "LEV": {"r": "Recueil de lois sur les sacrifices, les prêtres, la pureté et la sainteté, données au peuple campé au pied du Sinaï.", "a": "Attribué par la tradition à Moïse.", "e": "Situé au Sinaï, environ un an après la sortie d’Égypte.", "t": "Sacrifices ; sainteté ; pureté ; fêtes ; Jour des expiations.", "p": "1 à 7 : les sacrifices. 8 à 10 : les prêtres. 11 à 15 : la pureté. 16 : le Jour des expiations. 17 à 27 : la sainteté et les fêtes."}, "NUM": {"r": "Raconte la marche d’Israël depuis le Sinaï jusqu’aux portes de la terre promise, avec deux dénombrements du peuple.", "a": "Attribué par la tradition à Moïse.", "e": "Environ quarante ans dans le désert, selon le récit.", "t": "Désert ; incrédulité et fidélité ; conduite de Dieu ; dénombrement du peuple.", "p": "1 à 10 : au Sinaï. 11 à 21 : dans le désert. 22 à 36 : dans les plaines de Moab."}, "DEU": {"r": "Discours de Moïse avant sa mort : il rappelle l’histoire du peuple et la Loi, et appelle Israël à rester fidèle à l’alliance.", "a": "Attribué par la tradition à Moïse.", "e": "Dans les plaines de Moab, juste avant l’entrée en Canaan.", "t": "Écoute et obéissance ; amour de Dieu (chapitre 6) ; choix entre bénédiction et malédiction ; alliance.", "p": "1 à 4 : rappel de l’histoire. 5 à 26 : la Loi. 27 à 30 : alliance et choix. 31 à 34 : succession et mort de Moïse."}, "JOS": {"r": "Raconte la conquête et le partage du pays de Canaan sous la conduite de Josué, successeur de Moïse.", "a": "Non précisé ; la tradition l’attribue en grande partie à Josué.", "e": "Entrée en Canaan ; la date, discutée, est placée au XVe ou au XIIIe siècle av. J.-C.", "t": "Fidélité de Dieu à sa promesse ; la terre ; obéissance ; alliance.", "p": "1 à 12 : la conquête. 13 à 21 : le partage du pays. 22 à 24 : derniers discours et alliance de Sichem."}, "JDG": {"r": "Décrit la période entre Josué et les rois : des cycles d’infidélité, d’oppression et de délivrance par des juges comme Déborah, Gédéon ou Samson.", "a": "Anonyme ; la tradition juive l’attribue à Samuel.", "e": "Période des juges, environ du XIIIe au XIe siècle av. J.-C.", "t": "Infidélité et délivrance ; absence de roi ; chefs imparfaits.", "p": "1 à 2 : introduction. 3 à 16 : l’histoire des juges. 17 à 21 : récits de désordre."}, "RUT": {"r": "Court récit de loyauté : Ruth, une Moabite, reste auprès de sa belle-mère Naomi et épouse Boaz à Bethléem.", "a": "Anonyme ; la tradition juive pense à Samuel.", "e": "Le récit se situe au temps des juges ; la mise par écrit est plus tardive.", "t": "Loyauté ; fidélité de Dieu ; accueil de l’étranger ; rachat.", "p": "1 : l’exil et le retour de Naomi. 2 à 3 : Ruth et Boaz. 4 : le rachat et la généalogie de David."}, "1SA": {"r": "Raconte la naissance de Samuel, la fin de la période des juges, la royauté de Saül, puis l’ascension de David.", "a": "Anonyme ; la tradition juive l’attribue à Samuel, avec Nathan et Gad.", "e": "Environ du XIe au début du Xe siècle av. J.-C.", "t": "Royauté ; obéissance ; choix de David ; fidélité de Dieu.", "p": "1 à 7 : Éli et Samuel. 8 à 15 : Saül, premier roi. 16 à 31 : David et Saül."}, "2SA": {"r": "Raconte le règne de David : son accession au trône, ses victoires, ses fautes et leurs conséquences.", "a": "Anonyme.", "e": "Environ Xe siècle av. J.-C.", "t": "Royauté de David ; promesse faite à sa famille ; faute et pardon ; conséquences dans la famille.", "p": "1 à 10 : David devient roi. 11 à 20 : sa faute et les troubles. 21 à 24 : compléments."}, "1KI": {"r": "Raconte la fin du règne de David, le règne de Salomon et la construction du temple, puis la division du royaume et le ministère du prophète Élie.", "a": "Anonyme ; la tradition juive l’attribue à Jérémie.", "e": "Du Xe au IXe siècle av. J.-C.", "t": "Sagesse et temple ; infidélité ; division du royaume ; rôle des prophètes.", "p": "1 à 11 : Salomon. 12 à 22 : les royaumes d’Israël et de Juda, Élie."}, "2KI": {"r": "Suit l’histoire des royaumes d’Israël et de Juda jusqu’à la chute de Samarie (vers 722 av. J.-C.) et de Jérusalem (587 ou 586 av. J.-C.), avec le prophète Élisée.", "a": "Anonyme ; la tradition juive l’attribue à Jérémie.", "e": "Du IXe au VIe siècle av. J.-C.", "t": "Fidélité à l’alliance ; jugement ; exil ; prophètes.", "p": "1 à 17 : jusqu’à la chute du royaume d’Israël. 18 à 25 : Juda jusqu’à l’exil."}, "1CH": {"r": "Reprend l’histoire d’Israël depuis Adam par de longues généalogies, puis s’attarde sur le règne de David et les préparatifs du temple.", "a": "Anonyme ; la tradition juive l’attribue à Esdras.", "e": "Écrit après l’exil, probablement au Ve ou au IVe siècle av. J.-C.", "t": "Généalogies ; David ; culte et temple ; identité du peuple après l’exil.", "p": "1 à 9 : les généalogies. 10 à 29 : le règne de David."}, "2CH": {"r": "Raconte le règne de Salomon et la construction du temple, puis l’histoire des rois de Juda jusqu’à l’exil, et se termine par un décret de retour.", "a": "Anonyme ; la tradition juive l’attribue à Esdras.", "e": "Écrit après l’exil, probablement au Ve ou au IVe siècle av. J.-C.", "t": "Temple ; réformes religieuses ; repentance ; espérance du retour.", "p": "1 à 9 : Salomon et le temple. 10 à 36 : les rois de Juda jusqu’à l’exil et au décret de Cyrus."}, "EZR": {"r": "Raconte le retour des exilés à Jérusalem après le décret de Cyrus, la reconstruction du temple, puis la mission du scribe Esdras.", "a": "Anonyme ; la tradition l’attribue à Esdras.", "e": "De la fin du VIe au Ve siècle av. J.-C.", "t": "Retour d’exil ; reconstruction du temple ; la Loi ; renouveau du peuple.", "p": "1 à 6 : premier retour et reconstruction du temple. 7 à 10 : Esdras et la réforme."}, "NEH": {"r": "Raconte comment Néhémie reconstruit les murailles de Jérusalem et conduit un renouveau du peuple autour de la Loi.", "a": "Néhémie, pour une grande partie (ses mémoires) ; le livre a longtemps été joint à Esdras.", "e": "Vers le milieu du Ve siècle av. J.-C., sous le roi Artaxerxès.", "t": "Reconstruction ; prière ; lecture de la Loi ; engagement du peuple.", "p": "1 à 7 : les murailles. 8 à 10 : lecture de la Loi et engagement. 11 à 13 : repeuplement et réformes."}, "EST": {"r": "Récit d’une jeune juive devenue reine de Perse, qui sauve son peuple d’une menace d’extermination ; il explique l’origine de la fête de Pourim.", "a": "Anonyme.", "e": "Se déroule sous le roi Assuérus (Xerxès Ier), au Ve siècle av. J.-C.", "t": "Protection du peuple ; courage ; renversement des situations ; Pourim. Le nom de Dieu n’y est pas cité.", "p": "1 à 2 : Esther devient reine. 3 à 7 : le complot d’Haman. 8 à 10 : la délivrance et Pourim."}, "JOB": {"r": "Poème sur Job, un homme juste qui traverse de grandes souffrances, et sur ses dialogues avec ses amis, puis avec Dieu.", "a": "Anonyme.", "e": "Date de rédaction discutée ; l’ambiance du récit rappelle l’époque des patriarches.", "t": "Souffrance ; justice ; sagesse ; confiance en Dieu.", "p": "1 à 2 : prologue. 3 à 37 : dialogues avec ses amis. 38 à 42 : réponse de Dieu et épilogue."}, "PSA": {"r": "Recueil de 150 prières, chants et poèmes : louange, plainte, action de grâce, confiance, repentance.", "a": "Une grande partie est attribuée à David ; d’autres à Asaph, aux fils de Koré, à Salomon, à Moïse, ou sont anonymes.", "e": "Composés sur plusieurs siècles, du temps de David jusqu’après l’exil.", "t": "Louange ; prière dans la détresse ; confiance ; la Loi ; royauté de Dieu.", "p": "Cinq recueils : psaumes 1 à 41, 42 à 72, 73 à 89, 90 à 106, 107 à 150."}, "PRO": {"r": "Recueil de sentences et de conseils de sagesse pour bien conduire sa vie.", "a": "Attribué en grande partie à Salomon ; d’autres sages y contribuent.", "e": "Tradition remontant au Xe siècle av. J.-C., avec des ajouts plus tardifs.", "t": "Sagesse et folie ; crainte de l’Éternel ; justice ; paroles ; travail.", "p": "1 à 9 : discours de sagesse. 10 à 29 : recueils de sentences. 30 à 31 : paroles d’Agour et de Lémuel, portrait de la femme vaillante."}, "ECC": {"r": "Réflexion d’un sage, appelé Qohéleth, sur le sens de la vie, le travail, le plaisir et la mort, qui revient sur le thème de la « vanité ».", "a": "Se présente comme « fils de David, roi de Jérusalem » ; la tradition y voit Salomon.", "e": "Date discutée.", "t": "Sens de la vie ; limites de la sagesse ; joie dans les dons de Dieu ; crainte de Dieu.", "p": "Pas de plan strict : des réflexions sur la vie « sous le soleil », avec une conclusion en 12:13-14."}, "SOL": {"r": "Poème d’amour en dialogue entre un amant et sa bien-aimée.", "a": "Attribué à Salomon par son titre.", "e": "Date discutée.", "t": "Amour et désir ; fidélité ; beauté. Les traditions juive et chrétienne l’ont lu aussi de façon symbolique.", "p": "Une suite de poèmes et de chants, sans plan strict."}, "ISA": {"r": "Messages du prophète Ésaïe à Juda et à Jérusalem : jugement, appel à la fidélité, puis grandes promesses de consolation et d’espérance.", "a": "Ésaïe, fils d’Amots ; les spécialistes discutent l’unité du livre, surtout des chapitres 40 à 66.", "e": "Ministère à partir de la fin du VIIIe siècle av. J.-C.", "t": "Sainteté de Dieu ; jugement ; consolation ; le serviteur ; espérance.", "p": "1 à 39 : jugement et espérance. 40 à 55 : consolation. 56 à 66 : restauration."}, "JER": {"r": "Messages du prophète Jérémie avant et pendant la chute de Jérusalem : avertissements, souffrance personnelle et promesse d’une nouvelle alliance.", "a": "Jérémie, avec son scribe Baruch.", "e": "Environ de 627 à 580 av. J.-C.", "t": "Appel à revenir à Dieu ; jugement ; nouvelle alliance ; fidélité du prophète.", "p": "1 : appel. 2 à 25 : avertissements. 26 à 45 : récits. 46 à 51 : oracles contre les nations. 52 : chute de Jérusalem."}, "LAM": {"r": "Cinq poèmes de deuil sur la destruction de Jérusalem en 587 ou 586 av. J.-C.", "a": "Anonyme ; la tradition l’attribue à Jérémie.", "e": "Après la chute de Jérusalem, vers 587 ou 586 av. J.-C.", "t": "Deuil ; confession ; espérance dans la fidélité de Dieu.", "p": "Cinq chapitres ; les quatre premiers sont construits sur l’ordre de l’alphabet hébreu."}, "EZE": {"r": "Messages du prophète Ézéchiel, prêtre exilé à Babylone : visions de la gloire de Dieu, jugement de Jérusalem, puis promesses de restauration.", "a": "Ézéchiel, prêtre.", "e": "Environ de 593 à 571 av. J.-C.", "t": "Gloire de Dieu ; responsabilité personnelle ; renouveau du peuple ; nouveau temple.", "p": "1 à 24 : jugement de Jérusalem. 25 à 32 : oracles contre les nations. 33 à 48 : restauration et nouveau temple."}, "DAN": {"r": "Récits sur Daniel et ses compagnons à la cour de Babylone, puis visions sur l’avenir des empires et du règne de Dieu.", "a": "Daniel, selon la tradition ; certains spécialistes proposent une rédaction plus tardive, au IIe siècle av. J.-C.", "e": "Le récit se situe au VIe siècle av. J.-C., pendant l’exil. Une partie du livre est en araméen.", "t": "Fidélité en exil ; souveraineté de Dieu ; visions des empires ; espérance.", "p": "1 à 6 : récits. 7 à 12 : visions."}, "HOS": {"r": "Prophète du royaume du Nord, dont le mariage douloureux illustre l’amour fidèle de Dieu pour un peuple infidèle.", "a": "Osée.", "e": "VIIIe siècle av. J.-C., avant la chute de Samarie.", "t": "Fidélité de Dieu ; infidélité du peuple ; appel au retour.", "p": "1 à 3 : le mariage d’Osée. 4 à 14 : oracles contre Israël et appels au retour."}, "JOE": {"r": "Prophétie née d’une invasion de sauterelles et d’une sécheresse : appel à la repentance, jour de l’Éternel et promesse de l’Esprit.", "a": "Joël, fils de Péthuel.", "e": "Date discutée, entre le IXe et le IVe siècle av. J.-C.", "t": "Repentance ; jour de l’Éternel ; promesse de l’Esprit.", "p": "1:1 à 2:17 : le fléau et l’appel. 2:18 à 3:21 : promesses et jugement des nations."}, "AMO": {"r": "Berger de Tekoa envoyé au royaume du Nord pour dénoncer les injustices sociales et un culte vide.", "a": "Amos.", "e": "Environ 760 av. J.-C., sous le roi Jéroboam II.", "t": "Justice sociale ; jugement ; culte sincère ; espérance de restauration.", "p": "1 à 2 : oracles sur les nations. 3 à 6 : paroles contre Israël. 7 à 9 : visions et promesse."}, "OBA": {"r": "Le plus court livre de l’Ancien Testament, un seul chapitre : un oracle contre Édom, qui s’est réjoui de la chute de Jérusalem.", "a": "Abdias.", "e": "Après la chute de Jérusalem (587 ou 586 av. J.-C.) ; date discutée.", "t": "Justice de Dieu ; orgueil ; espérance pour Sion.", "p": "Un seul chapitre : jugement d’Édom puis espérance pour Israël."}, "JON": {"r": "Récit du prophète Jonas, envoyé à Ninive, qui fuit, est jeté à la mer, puis prêche ; la ville se repent et Dieu lui fait grâce.", "a": "Anonyme ; le livre parle de Jonas.", "e": "Le récit se situe au VIIIe siècle av. J.-C. ; la date de rédaction est discutée.", "t": "Compassion de Dieu ; obéissance ; repentance ; Dieu s’occupe de toutes les nations.", "p": "1 : la fuite. 2 : la prière. 3 : la prédication à Ninive. 4 : la colère de Jonas."}, "MIC": {"r": "Prophète de Juda, contemporain d’Ésaïe : il dénonce l’injustice, annonce le jugement et l’espérance, dont celle d’un chef né à Bethléem.", "a": "Michée.", "e": "Fin du VIIIe siècle av. J.-C.", "t": "Justice ; jugement ; espérance ; ce que Dieu demande (6:8).", "p": "1 à 3 : jugement. 4 à 5 : espérance. 6 à 7 : procès et pardon."}, "NAH": {"r": "Oracle contre Ninive, capitale de l’Assyrie, qui annonce sa chute.", "a": "Nahum.", "e": "Entre 663 et 612 av. J.-C.", "t": "Justice de Dieu ; fin de la violence ; Dieu refuge pour ceux qui se confient en lui.", "p": "1 : Dieu juge. 2 à 3 : la chute de Ninive."}, "HAB": {"r": "Dialogue du prophète avec Dieu sur l’injustice et la violence, suivi d’une prière de confiance.", "a": "Habacuc.", "e": "Fin du VIIe siècle av. J.-C., avant l’invasion babylonienne.", "t": "Pourquoi le mal ? ; foi ; justice de Dieu ; confiance.", "p": "1 à 2 : deux plaintes et deux réponses. 3 : prière sous forme de psaume."}, "ZEP": {"r": "Annonce le jour de l’Éternel, jour de jugement, et promet un reste humble et la joie du renouveau.", "a": "Sophonie.", "e": "Règne de Josias, vers 640 à 609 av. J.-C.", "t": "Jour de l’Éternel ; humilité ; reste fidèle ; joie.", "p": "1:1 à 3:8 : jugement. 3:9 à 20 : espérance."}, "HAG": {"r": "Encourage les exilés revenus à reprendre la reconstruction du temple de Jérusalem.", "a": "Aggée.", "e": "520 av. J.-C., sous le roi Darius.", "t": "Priorités ; temple ; encouragement ; présence de Dieu.", "p": "Quatre messages datés de l’année 520 av. J.-C."}, "ZEC": {"r": "Visions et messages au temps de la reconstruction du temple : encouragement, purification, espérance d’un roi à venir.", "a": "Zacharie ; les chapitres 9 à 14 sont de date discutée.", "e": "À partir de 520 av. J.-C.", "t": "Retour à Dieu ; visions ; temple ; roi à venir ; espérance.", "p": "1 à 8 : visions et messages. 9 à 14 : oracles sur l’avenir."}, "MAL": {"r": "Dernier livre de l’Ancien Testament dans l’ordre chrétien : reproches au peuple et aux prêtres négligents, appel à la fidélité et annonce d’un messager.", "a": "Malachie.", "e": "Vers le Ve siècle av. J.-C., après la reconstruction du temple.", "t": "Fidélité ; culte sincère ; justice ; alliance.", "p": "Une série de dialogues entre Dieu et le peuple."}, "MAT": {"r": "Évangile qui présente Jésus comme le Messie annoncé dans l’Ancien Testament et comme enseignant : Sermon sur la montagne, paraboles du royaume.", "a": "Matthieu, l’un des douze apôtres, selon la tradition.", "e": "Écrit au Ier siècle ; la date, discutée, se situe souvent entre 70 et 90 ap. J.-C.", "t": "Royaume des cieux ; accomplissement des Écritures ; enseignement ; devenir disciple.", "p": "1 à 4 : naissance et débuts. 5 à 7 : Sermon sur la montagne. 8 à 25 : ministère et enseignements. 26 à 28 : passion et résurrection."}, "MAR": {"r": "Le plus court des Évangiles : un récit rapide du ministère, de la mort et de la résurrection de Jésus, présenté comme le Fils de Dieu.", "a": "Jean-Marc, compagnon de Pierre et de Paul, selon la tradition.", "e": "Souvent daté vers 65 à 70 ap. J.-C.", "t": "Identité de Jésus ; service et souffrance ; suivre Jésus.", "p": "1:1-13 : préparation. 1:14 à 8:26 : ministère en Galilée. 8:27 à 10:52 : en route vers Jérusalem. 11 à 16 : Jérusalem, passion et résurrection."}, "LUK": {"r": "Évangile adressé à Théophile : un récit ordonné de la vie de Jésus, avec une attention particulière aux pauvres, aux femmes et aux exclus.", "a": "Luc, médecin et compagnon de Paul, selon la tradition ; il est aussi l’auteur des Actes.", "e": "Écrit au Ier siècle, souvent entre 60 et 85 ap. J.-C.", "t": "Salut pour tous ; compassion ; prière ; Esprit.", "p": "1 à 2 : naissance. 3 à 9 : Galilée. 9:51 à 19:27 : route vers Jérusalem. 19:28 à 24 : Jérusalem, passion et résurrection."}, "JOH": {"r": "Évangile qui présente Jésus comme le Fils de Dieu, par des signes et de longs discours, « afin que vous croyiez ».", "a": "Jean, fils de Zébédée, disciple de Jésus, selon la tradition.", "e": "Fin du Ier siècle, vers 85 à 95 ap. J.-C. selon une opinion courante.", "t": "Vie ; lumière ; croire ; amour ; signes ; les paroles « Je suis ».", "p": "1:1-18 : prologue. 1:19 à 12 : signes et discours publics. 13 à 17 : derniers discours. 18 à 21 : passion et résurrection."}, "ACT": {"r": "Suite de l’Évangile de Luc : raconte la naissance de l’Église à Jérusalem et sa diffusion jusqu’à Rome, d’abord avec Pierre, puis avec Paul.", "a": "Luc, selon la tradition.", "e": "Raconte environ trente ans, de 30 à 62 ap. J.-C. ; écrit probablement entre 60 et 85.", "t": "Esprit ; témoignage ; mission ; unité.", "p": "1 à 7 : Jérusalem. 8 à 12 : Judée, Samarie et au-delà. 13 à 28 : voyages de Paul jusqu’à Rome."}, "ROM": {"r": "Lettre de Paul aux chrétiens de Rome : exposé de l’Évangile (le péché, la justification par la foi, la vie dans l’Esprit), place d’Israël, conseils pratiques.", "a": "Paul.", "e": "Vers 56 à 57 ap. J.-C., écrite probablement depuis Corinthe.", "t": "Justification par la foi ; grâce ; Esprit ; Israël et les nations ; vie chrétienne.", "p": "1 à 8 : l’Évangile. 9 à 11 : Israël. 12 à 15 : la vie pratique. 16 : salutations."}, "1CO": {"r": "Lettre de Paul à l’Église de Corinthe, divisée : il répond à des problèmes (divisions, morale, repas, culte, dons spirituels) et à des questions sur la résurrection.", "a": "Paul.", "e": "Vers 55 ap. J.-C., écrite depuis Éphèse.", "t": "Unité ; amour (chapitre 13) ; dons spirituels ; résurrection.", "p": "1 à 4 : divisions. 5 à 7 : morale et mariage. 8 à 14 : culte et dons. 15 : résurrection. 16 : collecte et salutations."}, "2CO": {"r": "Lettre personnelle de Paul sur son ministère, sa faiblesse et la réconciliation avec l’Église de Corinthe, avec un appel à la générosité.", "a": "Paul.", "e": "Vers 56 ap. J.-C., écrite depuis la Macédoine.", "t": "Consolation dans l’épreuve ; ministère ; faiblesse et force ; générosité.", "p": "1 à 7 : ministère et réconciliation. 8 à 9 : la collecte. 10 à 13 : défense de son autorité."}, "GAL": {"r": "Lettre de Paul aux Églises de Galatie : il défend l’Évangile de la grâce contre l’idée qu’il faut suivre la Loi juive pour être sauvé.", "a": "Paul.", "e": "Vers 48 à 55 ap. J.-C., selon les hypothèses.", "t": "Liberté ; justification par la foi ; Esprit ; fruit de l’Esprit.", "p": "1 à 2 : défense de l’Évangile. 3 à 4 : foi et Loi. 5 à 6 : vie dans l’Esprit."}, "EPH": {"r": "Lettre de Paul sur la place de l’Église dans le plan de Dieu et sur la vie unie qui en découle.", "a": "Paul, selon la tradition ; certains spécialistes discutent l’auteur.", "e": "Vers 60 à 62 ap. J.-C., écrite depuis la prison selon la tradition.", "t": "Unité ; grâce ; Christ et l’Église ; vie nouvelle.", "p": "1 à 3 : ce que Dieu a fait. 4 à 6 : comment vivre."}, "PHI": {"r": "Lettre de remerciement de Paul aux chrétiens de Philippes, écrite depuis la prison ; appel à l’humilité et à la joie.", "a": "Paul.", "e": "Vers 60 à 62 ap. J.-C.", "t": "Joie ; humilité (hymne de 2:5-11) ; communion ; contentement.", "p": "1 : la situation de Paul. 2 : l’humilité. 3 : l’essentiel. 4 : remerciements et exhortations."}, "COL": {"r": "Lettre de Paul aux chrétiens de Colosses : il met en garde contre de faux enseignements en affirmant la primauté du Christ.", "a": "Paul.", "e": "Vers 60 à 62 ap. J.-C., écrite depuis la prison.", "t": "Primauté du Christ ; plénitude ; vie nouvelle.", "p": "1 à 2 : le Christ et les faux enseignements. 3 à 4 : la vie nouvelle."}, "1TH": {"r": "L’une des plus anciennes lettres de Paul : elle encourage une jeune Église et répond à des questions sur le retour du Seigneur.", "a": "Paul.", "e": "Vers 50 à 51 ap. J.-C., écrite depuis Corinthe.", "t": "Foi, amour, espérance ; sainteté ; retour du Seigneur.", "p": "1 à 3 : souvenirs et remerciements. 4 à 5 : exhortations et espérance."}, "2TH": {"r": "Courte lettre qui précise des points sur le retour du Seigneur et exhorte à persévérer et à travailler.", "a": "Paul.", "e": "Peu après la première lettre, vers 51 ap. J.-C.", "t": "Persévérance ; jour du Seigneur ; travail.", "p": "1 : encouragement. 2 : le jour du Seigneur. 3 : exhortations."}, "1TI": {"r": "Lettre de Paul à son collaborateur Timothée sur l’organisation et la conduite de l’Église d’Éphèse.", "a": "Paul, selon la tradition ; certains spécialistes discutent l’auteur des lettres pastorales.", "e": "Vers 62 à 65 ap. J.-C.", "t": "Saine doctrine ; responsables de l’Église ; prière ; conduite.", "p": "1 : faux enseignements. 2 à 3 : culte et responsables. 4 à 6 : conseils personnels."}, "2TI": {"r": "Dernière lettre de Paul, selon la tradition : les conseils d’un apôtre prisonnier à son collaborateur Timothée.", "a": "Paul, selon la tradition ; certains spécialistes discutent l’auteur des lettres pastorales.", "e": "Vers 64 à 67 ap. J.-C., peu avant sa mort selon la tradition.", "t": "Fidélité ; persévérance ; l’Écriture ; transmission.", "p": "1 : encouragement. 2 à 3 : persévérer. 4 : derniers conseils et salutations."}, "TIT": {"r": "Lettre de Paul à Tite, laissé en Crète pour y organiser l’Église et encourager les bonnes œuvres.", "a": "Paul, selon la tradition ; certains spécialistes discutent l’auteur des lettres pastorales.", "e": "Vers 62 à 65 ap. J.-C.", "t": "Responsables de l’Église ; saine doctrine ; bonnes œuvres ; grâce.", "p": "1 : responsables. 2 : enseignement selon les âges. 3 : vie dans la société."}, "PHM": {"r": "Très courte lettre personnelle : Paul plaide auprès de Philémon pour qu’il accueille Onésime, son esclave en fuite, comme un frère.", "a": "Paul.", "e": "Vers 60 à 62 ap. J.-C., écrite depuis la prison.", "t": "Réconciliation ; fraternité ; grâce.", "p": "Un seul chapitre : salutations, plaidoyer pour Onésime, conclusion."}, "HEB": {"r": "Écrit à des chrétiens d’origine juive pour les encourager à tenir ferme, en montrant que Jésus est supérieur aux anges, à Moïse et aux prêtres.", "a": "Anonyme ; certaines traditions anciennes l’attribuent à Paul, ce qui est aujourd’hui discuté.", "e": "Date discutée ; plusieurs la placent avant 70 ap. J.-C.", "t": "Supériorité du Christ ; foi (chapitre 11) ; persévérance ; sacerdoce.", "p": "1 à 10 : le Christ est supérieur. 11 : exemples de foi. 12 à 13 : persévérer."}, "JAM": {"r": "Lettre pratique sur une foi qui agit : épreuves, sagesse, paroles, richesse, prière.", "a": "Jacques, frère de Jésus, selon la tradition.", "e": "Date discutée, souvent placée entre 45 et 60 ap. J.-C.", "t": "Foi et œuvres ; sagesse ; maîtrise de la parole ; justice sociale.", "p": "Une suite de conseils, sans plan strict."}, "1PE": {"r": "Lettre de Pierre pour encourager des chrétiens qui souffrent, dispersés en Asie Mineure.", "a": "Pierre, selon la tradition.", "e": "Vers 62 à 64 ap. J.-C.", "t": "Espérance ; souffrance ; sainteté ; témoignage.", "p": "1 à 2:10 : identité des croyants. 2:11 à 4 : vivre au milieu des difficultés. 5 : conseils aux responsables."}, "2PE": {"r": "Lettre de Pierre, vers la fin de sa vie, qui met en garde contre les faux enseignants et rappelle l’espérance du retour du Seigneur.", "a": "Pierre, selon la tradition ; certains spécialistes discutent l’authenticité.", "e": "Vers 64 à 68 ap. J.-C. selon la tradition.", "t": "Connaissance du Christ ; faux enseignants ; retour du Seigneur.", "p": "1 : croître dans la foi. 2 : les faux enseignants. 3 : le retour du Seigneur."}, "1JO": {"r": "Lettre pastorale sur la communion avec Dieu : lumière, amour, vérité, assurance de la vie éternelle.", "a": "Jean, selon la tradition.", "e": "Fin du Ier siècle ap. J.-C.", "t": "Amour ; lumière ; vérité ; assurance.", "p": "Des enseignements qui reviennent sur trois thèmes : la lumière, l’amour et la foi."}, "2JO": {"r": "Très brève lettre adressée à « la dame élue » : demeurer dans la vérité et l’amour, et se garder des faux enseignants.", "a": "Jean, selon la tradition.", "e": "Fin du Ier siècle ap. J.-C.", "t": "Vérité ; amour ; vigilance.", "p": "Un seul chapitre."}, "3JO": {"r": "Brève lettre à Gaïus : elle loue son hospitalité envers les missionnaires itinérants et critique l’attitude de Diotrèphe.", "a": "Jean, selon la tradition.", "e": "Fin du Ier siècle ap. J.-C.", "t": "Hospitalité ; vérité ; humilité.", "p": "Un seul chapitre."}, "JUD": {"r": "Courte lettre qui exhorte à combattre pour la foi et met en garde contre de faux enseignants.", "a": "Jude, frère de Jacques et de Jésus, selon la tradition.", "e": "Date discutée, souvent placée entre 65 et 80 ap. J.-C.", "t": "Fidélité à la foi ; vigilance ; persévérance.", "p": "Un seul chapitre."}, "REV": {"r": "Livre de visions de Jean, adressé à sept Églises d’Asie : il encourage à rester fidèle dans l’épreuve et annonce la victoire finale de Dieu et de l’Agneau. Le mot « apocalypse » signifie « révélation ».", "a": "Jean ; la tradition y voit l’apôtre.", "e": "Fin du Ier siècle, vers 95 ap. J.-C. selon la tradition ancienne.", "t": "Victoire de Dieu ; fidélité ; jugement ; nouvelle création.", "p": "1 à 3 : lettres aux sept Églises. 4 à 22 : visions de la fin et de la nouvelle Jérusalem."}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const theme=()=>{const r=document.documentElement;S.theme?r.setAttribute("data-theme",S.theme):r.removeAttribute("data-theme")};
const sw=()=>`<div class="sw"><button id="lg" aria-label="Français / English">${S.lang==="fr"?"EN":"FR"}</button></div>`;
const draft=()=>{const d={};document.querySelectorAll("#f input:not([type=password]),#f select").forEach(e=>{if(e.type==="radio"){if(e.checked)d.sex=e.value}else d[e.id]=e.type==="checkbox"?e.checked:e.value});return d};
const seen=u=>{try{return localStorage.getItem("welcomed_"+u.id)}catch(e){return 1}};
const field=(id,label,type,val,ac,extra="")=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" autocomplete="${ac}" value="${esc(val||"")}" ${extra}><div class="err" id="e-${id}" role="alert"></div>`;
function viewLogin(d){return `<main>${sw()}<h1>${t("log")}</h1><p>${t("logs")}</p><div class="card"><form id="f" novalidate>${field("email",t("email"),"email",d.email,"email")}${field("pw",t("pw"),"password","","current-password")}<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("in")}</button></form></div><button class="lnk" id="toReg">${t("toReg")}</button><button class="lnk" id="fg">${t("forgot")}</button></main>`}
function viewReg(d){
return `<main>${sw()}<h1>${t("reg")}</h1><p>${t("sub")}</p><div class="card"><form id="f" novalidate>${field("name",t("name"),"text",d.name,"nickname")}
<label for="cq">${t("country")}</label><div class="cb"><span class="fi fi-xx"></span><input id="cq" role="combobox" aria-expanded="false" aria-controls="cl" aria-autocomplete="list" autocomplete="off" placeholder="${esc(t("pick"))}"><ul id="cl" role="listbox" hidden></ul></div><input type="hidden" id="country"><div class="err" id="e-country" role="alert"></div>
<label for="tel">${t("tel")} <span class="opt">(${t("opt")})</span></label><div class="ph"><span id="dial" aria-live="polite">+</span><input id="tel" type="tel" inputmode="tel" autocomplete="tel-national" value="${esc(d.tel||"")}"></div><div class="err" id="e-tel" role="alert"></div>
<div class="row2"><div>${field("age",t("age"),"number",d.age,"off",'inputmode="numeric" min="1" max="120"')}</div><fieldset class="sx"><legend>${t("sex")}</legend><label class="rd"><input type="radio" name="sex" value="M" ${d.sex==="M"?"checked":""}>${t("sexM")}</label><label class="rd"><input type="radio" name="sex" value="F" ${d.sex==="F"?"checked":""}>${t("sexF")}</label><label class="rd"><input type="radio" name="sex" value="N" ${d.sex==="N"?"checked":""}>${t("sexN")}</label><div class="err" id="e-sex" role="alert"></div></fieldset></div>${field("email",t("email"),"email",d.email,"email")}${field("pw",`${t("pw")} <span class="opt">(${t("pwh")})</span>`,"password","","new-password")}
<label class="chk" for="cgu"><input id="cgu" type="checkbox" ${d.cgu?"checked":""}><span>${t("cgu")}</span></label><div class="err" id="e-cgu" role="alert"></div>
<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("go")}</button></form></div><button class="lnk" id="toLog">${t("toLog")}</button></main>`}
function initCb(a,sel){
const box=a.querySelector(".cb"),q=a.querySelector("#cq"),h=a.querySelector("#country"),ul=a.querySelector("#cl"),fl=box.querySelector(".fi");
const L=countries(),norm=x=>x.normalize("NFD").replace(/\p{M}/gu,"").toLowerCase(),nm=c=>(L.find(x=>x[0]===c)||[])[1]||"";
let act=-1,shown=[];
const setSel=c=>{h.value=c||"";q.value=c?nm(c):"";box.classList.toggle("sel",!!c);fl.className="fi fi-"+(c||"xx").toLowerCase();const dl=a.querySelector("#dial");if(dl)dl.textContent=c&&DC[c]?"+"+DC[c]:"+"};
const draw=()=>{const f=norm(q.value.trim()),all=h.value&&q.value===nm(h.value);shown=L.filter(([c,n])=>all||!f||norm(n).includes(f));
ul.innerHTML=shown.length?shown.map(([c,n],i)=>`<li role="option" data-c="${c}" aria-selected="${i===act}"><span class="fi fi-${c.toLowerCase()}"></span>${esc(n)}<span class="dc">+${DC[c]||""}</span></li>`).join(""):`<li>${t("noc")}</li>`;ul.hidden=false;q.setAttribute("aria-expanded","true")};
const shut=()=>{ul.hidden=true;q.setAttribute("aria-expanded","false");act=-1};
const close=()=>{shut();q.value=h.value?nm(h.value):""};
const pick=c=>{setSel(c);shut()};
q.oninput=()=>{h.value="";a.querySelector("#dial").textContent="+";box.classList.remove("sel");act=-1;draw()};
q.onfocus=()=>{q.select();draw()};
q.onclick=()=>{if(ul.hidden)draw()};
q.onblur=()=>setTimeout(close,150);
ul.onmousedown=e=>{const li=e.target.closest("li[data-c]");if(li){e.preventDefault();pick(li.dataset.c)}};
q.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(ul.hidden)draw();act=Math.max(0,Math.min(shown.length-1,act+(e.key==="ArrowDown"?1:-1)));[...ul.children].forEach((li,i)=>li.setAttribute("aria-selected",i===act));const o=ul.children[act];if(o)o.scrollIntoView({block:"nearest"})}
else if(e.key==="Enter"&&!ul.hidden&&shown.length&&(act>=0||shown.length===1)){e.preventDefault();pick(shown[act>=0?act:0][0])}
else if(e.key==="Escape")close()};
setSel(sel)}
const viewCheck=()=>`<main>${sw()}<h1>${t("chk")}</h1><p>${t("chkp")}<b>${esc(S.email)}</b>${t("chkq")}</p><button class="lnk" id="toLog">${t("toLog")}</button></main>`;
const viewNew=()=>`<main>${sw()}<h1>${t("newpw")}</h1><div class="card"><form id="f" novalidate>${field("pw",t("pw")+` <span class="opt">(${t("pwh")})</span>`,"password","","new-password")}<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("save")}</button></form></div></main>`;
const viewWelcome=()=>`<main>${sw()}<h1>${t("hi")}${esc(S.user.user_metadata.pseudo||"")}</h1><div class="verse card"><q>${t("verse")}</q><cite>${t("ref")}</cite></div><button class="go" id="enter">${t("enter")}</button></main>`;
const COURS=[{"t": "La Bible : qu’est-ce que c’est ?", "p": ["Le mot « Bible » vient du grec biblia, qui veut dire « les livres ». La Bible n’est pas un seul livre : c’est une bibliothèque de livres, écrits par de nombreux auteurs, en des lieux et à des époques différents, sur plusieurs siècles."], "u": ["Langues d’origine : l’hébreu pour l’essentiel, quelques passages en araméen (notamment dans Daniel et Esdras), et le grec.", "Deux grandes parties : l’Ancien Testament et le Nouveau Testament.", "Dans cette application, la Bible compte 66 livres : 39 pour l’Ancien Testament et 27 pour le Nouveau (c’est le canon protestant, voir la leçon 7).", "Chapitres et versets : ce découpage n’existe pas dans les textes d’origine. Les chapitres ont été introduits vers le XIIIe siècle, et la numérotation des versets au XVIe siècle (on l’attribue à Robert Estienne). Ils servent à retrouver un passage : « Jean 3:16 » désigne le livre de Jean, chapitre 3, verset 16."], "l": [["Lire Genèse 1", "GEN", 1, 1], ["Lire Jean 3:16", "JOH", 3, 16]], "ic": "📖"}, {"t": "L’Ancien et le Nouveau Testament", "p": ["Le mot « testament » traduit un mot qui signifie « alliance » (berit en hébreu, diathêkê en grec) : une relation engagée entre Dieu et son peuple, telle que la décrivent les textes."], "u": ["Ancien Testament : 39 livres, écrits avant l’ère chrétienne. Il raconte l’histoire d’Israël et contient la Loi, des récits, des poèmes, des écrits de sagesse et des prophéties. Pour l’essentiel, ce sont aussi les textes de la Bible hébraïque des Juifs (le Tanakh), classés autrement.", "Nouveau Testament : 27 livres, écrits en grec, au premier siècle de notre ère selon la datation la plus courante. Il contient les quatre Évangiles, les Actes des apôtres, des lettres (épîtres) et l’Apocalypse. Il présente la vie et l’enseignement de Jésus et les débuts de l’Église."], "p2": ["Dans la table des matières de l’application, les livres sont regroupés par catégories pour vous aider à vous repérer."], "l": [["Lire Matthieu 1", "MAT", 1, 1], ["Lire Psaume 1", "PSA", 1, 1]], "ic": "📜"}, {"t": "Le Pentateuque", "p": ["« Pentateuque » vient du grec et signifie « cinq livres » (ou « cinq rouleaux »). Ce sont les cinq premiers livres de la Bible."], "u": ["Genèse : les origines du monde et de l’humanité, puis l’histoire d’Abraham, d’Isaac, de Jacob et de Joseph.", "Exode : la sortie d’Égypte, l’alliance au Sinaï et les dix commandements.", "Lévitique : les lois sur le culte, les sacrifices et la sainteté.", "Nombres : les années dans le désert et le recensement du peuple.", "Deutéronome : les derniers discours de Moïse avant l’entrée dans la terre promise."], "p2": ["La tradition juive et chrétienne attribue ces livres à Moïse. Des chercheurs proposent d’autres explications sur leur composition, par exemple l’« hypothèse documentaire », qui y voit plusieurs sources réunies. Le sujet est débattu."], "l": [["Lire Genèse 1", "GEN", 1, 1], ["Lire Exode 20", "EXO", 20, 1], ["Lire Deutéronome 6", "DEU", 6, 1]], "ic": "📚"}, {"t": "La Torah et le Tanakh", "p": ["« Torah » est un mot hébreu qui signifie « enseignement » ou « instruction ». On le traduit souvent par « Loi »."], "u": ["Au sens strict, la Torah désigne les cinq livres de Moïse, c’est-à-dire le Pentateuque.", "Au sens large, ce mot peut désigner l’ensemble de l’enseignement transmis dans la tradition juive.", "Le Tanakh est le nom de la Bible hébraïque. C’est un sigle : T pour Torah (la Loi), N pour Nevi’im (les Prophètes) et K pour Ketouvim (les Écrits).", "Dans la tradition juive, le Tanakh compte 24 livres. Ce sont, pour l’essentiel, les mêmes textes que l’Ancien Testament protestant, regroupés et ordonnés autrement."], "l": [["Lire Exode 19", "EXO", 19, 1]], "ic": "🕎"}, {"t": "Les genres littéraires : lire chaque livre selon sa nature", "p": ["La Bible contient des textes très différents. Les lire selon leur genre aide à mieux les comprendre."], "u": ["Loi : des règles et des instructions (Exode, Lévitique), à lire dans le cadre de l’alliance où elles sont données.", "Récits historiques : Josué, Juges, Rois… ils racontent des événements, souvent avec un message sur Dieu et son peuple.", "Poésie et chants : les Psaumes, le Cantique des cantiques. Ils emploient des images et des parallélismes, et ne se lisent pas comme de la prose.", "Sagesse : Proverbes, Ecclésiaste, Job. Ce sont des réflexions sur la vie ; les proverbes expriment des observations générales.", "Prophéties : Ésaïe, Jérémie, Daniel… des messages adressés à un peuple à une époque donnée, avec des avertissements, des consolations et des annonces.", "Évangiles : des récits de la vie, des paroles, de la mort et de la résurrection de Jésus.", "Lettres (épîtres) : écrites à des communautés ou à des personnes, elles répondent à des situations précises.", "Apocalypse : un livre de visions au langage symbolique, à lire en tenant compte de ses images."], "l": [["Lire Psaume 23", "PSA", 23, 1], ["Lire Proverbes 1", "PRO", 1, 1], ["Lire Ésaïe 53", "ISA", 53, 1]], "ic": "🎭"}, {"t": "Les quatre Évangiles", "p": ["« Évangile » vient du grec euangelion, qui signifie « bonne nouvelle ». Les quatre Évangiles sont quatre récits de la vie de Jésus : Matthieu, Marc, Luc et Jean."], "u": ["Matthieu, Marc et Luc sont appelés les évangiles « synoptiques » : ils se ressemblent beaucoup et peuvent se lire côte à côte, « d’un même regard ».", "Jean a un style et un contenu plus distincts.", "Marc est le plus court des quatre. Beaucoup de lecteurs commencent par Marc ou par Jean."], "l": [["Lire Marc 1", "MAR", 1, 1], ["Lire Jean 1", "JOH", 1, 1], ["Lire Luc 2", "LUK", 2, 1]], "ic": "✝️"}, {"t": "Qui est qui au temps de Jésus ?", "ic": "👥", "p": ["Quand on lit les Évangiles, on rencontre beaucoup de groupes : pharisiens, sadducéens, scribes, publicains, Samaritains… Ils ne pensent pas tous la même chose, et ils ne réagissent pas de la même façon à Jésus. Les connaître aide à comprendre pourquoi une discussion éclate, ou pourquoi une parabole choque.", "Le pays est alors sous domination romaine. Le Temple de Jérusalem reste le centre de la vie religieuse, mais le peuple est divisé sur la manière de rester fidèle à Dieu : suivre la tradition, collaborer avec Rome, se retirer au désert, ou prendre les armes. Voici un aperçu, avec une leçon pour chaque groupe."], "u": ["Les pharisiens : très attachés à la Loi et aux traditions, proches du peuple et des synagogues.", "Les sadducéens : l’aristocratie des prêtres, liée au Temple, qui n’accepte que la Loi écrite.", "Les scribes : les spécialistes qui copient, étudient et enseignent la Loi.", "Les esséniens : une communauté séparée, retirée du Temple et de la vie ordinaire.", "Les zélotes : ceux qui veulent chasser les Romains, parfois par la violence.", "Les hérodiens : les partisans de la famille d’Hérode, appuyée par Rome.", "Les samaritains : un peuple voisin, mis à l’écart par les Juifs.", "Les publicains : des Juifs qui percevaient les impôts au profit de Rome.", "Le Sanhédrin : le conseil suprême de Jérusalem.", "Les prêtres et les lévites : ceux qui servent au Temple."], "p2": ["Ces groupes ne sont pas toujours séparés : un scribe peut être pharisien, et un prêtre sadducéen. Dans les Évangiles, ce sont surtout les chefs des prêtres, les pharisiens et les scribes qui s’opposent à Jésus. Mais on y trouve aussi des membres de ces groupes qui l’écoutent, comme Nicodème."], "d": [["Secte", "Dans le vocabulaire de l’époque, un courant religieux (en grec hairesis). Le mot n’a pas ici le sens négatif d’aujourd’hui."], ["Domination romaine", "Rome gouvernait la Judée par un préfet, comme Ponce Pilate, tout en laissant une certaine liberté religieuse."]], "l": [["Lire Matthieu 22", "MAT", 22, 15], ["Lire Actes 23:6-8", "ACT", 23, 6]]}, {"t": "Les pharisiens", "ic": "📏", "p": ["Le nom « pharisien » vient d’un mot hébreu (perushim) qui signifie à peu près « séparés » : ils voulaient vivre à part des impuretés, pour appartenir pleinement à Dieu. C’était un mouvement de laïcs, très proche du peuple, actif dans les synagogues. Ils étudiaient la Loi de Moïse avec soin et lui ajoutaient une tradition orale, « la tradition des anciens » (Marc 7:3-5), pour dire comment l’appliquer chaque jour : le sabbat, la pureté, la dîme.", "Ils croyaient à la résurrection des morts, aux anges et aux esprits (Actes 23:8). Sur ces points, ils étaient proches de l’enseignement de Jésus, ce qui explique que plusieurs aient discuté avec lui, ou même l’aient invité à leur table (Luc 7:36 ; 14:1)."], "u": ["Leur force : un grand respect de la Parole de Dieu et le souci de vivre ce qu’elle dit.", "Le reproche de Jésus : mettre la tradition au-dessus du commandement de Dieu (Marc 7:8-9) et vivre pour être vu des hommes (Matthieu 23:5).", "Il ne les condamne pas tous : Nicodème est venu le trouver de nuit (Jean 3), et Gamaliel a conseillé la prudence face aux apôtres (Actes 5:34-39).", "Paul était pharisien avant de suivre Jésus (Actes 23:6 ; Philippiens 3:5)."], "p2": ["Après la destruction du Temple en l’an 70, c’est le courant pharisien qui a donné au judaïsme sa forme actuelle. Les paroles dures de Jésus (Matthieu 23) visent des attitudes que chacun peut avoir, et pas seulement un groupe d’autrefois."], "d": [["Pharisien", "Membre d’un courant juif attaché à la Loi et à la tradition orale. Le nom évoque l’idée de « séparés »."], ["Tradition des anciens", "Enseignements transmis oralement, qui expliquent comment appliquer la Loi."], ["Hypocrite", "À l’origine, un acteur. Dans les Évangiles : quelqu’un qui joue un rôle devant les autres."]], "l": [["Lire Matthieu 23", "MAT", 23, 1], ["Lire Marc 7:1-13", "MAR", 7, 1], ["Lire Jean 3", "JOH", 3, 1]]}, {"t": "Les sadducéens", "ic": "🏛️", "p": ["Les sadducéens formaient un groupe plus restreint et plus riche que les pharisiens. Leur nom vient probablement de Tsadok, le grand prêtre du temps de David et de Salomon. Beaucoup appartenaient aux familles de prêtres et tenaient les postes importants du Temple de Jérusalem. Ils avaient intérêt à garder la paix avec Rome et collaboraient avec l’occupant.", "Leur enseignement différait de celui des pharisiens : ils s’appuyaient surtout sur la Loi écrite et refusaient la tradition orale. Ils ne croyaient pas à la résurrection des morts, ni aux anges, ni aux esprits (Actes 23:8). C’est pourquoi ils ont posé à Jésus la question d’une femme qui aurait eu sept maris : ils voulaient ridiculiser la résurrection (Matthieu 22:23-33). Jésus leur répond qu’ils se trompent, car ils ne connaissent ni les Écritures ni la puissance de Dieu."], "u": ["Ils dominent la fonction de grand prêtre et le Temple (Actes 4:1 ; 5:17).", "Ils s’inquiètent quand les apôtres annoncent la résurrection de Jésus (Actes 4:1-2).", "Les chefs des prêtres craignent qu’un mouvement populaire autour de Jésus n’attire la colère de Rome (Jean 11:47-48).", "Ils disparaissent après la destruction du Temple en l’an 70, car leur autorité dépendait de lui."], "d": [["Sadducéen", "Membre d’un groupe de prêtres et de notables, attaché à la Loi écrite, qui nie la résurrection."], ["Résurrection", "Retour à la vie des morts. Les pharisiens y croient, les sadducéens non."]], "l": [["Lire Matthieu 22:23-33", "MAT", 22, 23], ["Lire Actes 23:6-9", "ACT", 23, 6], ["Lire Actes 4:1-4", "ACT", 4, 1]]}, {"t": "Les scribes (docteurs de la Loi)", "ic": "✒️", "p": ["Les scribes sont les spécialistes de l’Écriture. À l’origine, leur travail consistait à copier les livres saints. Esdras est le modèle : un « scribe versé dans la loi de Moïse » (Esdras 7:6). Au temps de Jésus, ils étudient la Loi, la commentent, la font respecter et enseignent le peuple. Les Évangiles les appellent aussi « docteurs de la loi » ou « légistes ». On les rencontre dans les synagogues, au Temple et dans les tribunaux.", "La plupart étaient pharisiens, quelques-uns sadducéens. Les Évangiles les mentionnent souvent avec les chefs des prêtres et les anciens, parce qu’ils siégeaient au Sanhédrin. Comme ils pouvaient citer précisément l’Écriture, ils posaient à Jésus des questions pour l’éprouver."], "u": ["Jésus enseigne avec autorité, à la différence des scribes (Matthieu 7:29).", "Il leur reproche de charger les autres de fardeaux qu’ils ne portent pas eux-mêmes (Matthieu 23:4).", "Un scribe lui demande quel est le plus grand commandement ; Jésus lui répond : « Tu n’es pas loin du royaume de Dieu » (Marc 12:28-34).", "Un scribe peut aussi devenir disciple : Jésus parle d’un scribe instruit du royaume des cieux (Matthieu 13:52)."], "d": [["Scribe", "Spécialiste qui copie, étudie et enseigne l’Écriture."], ["Docteur de la loi", "Autre nom des scribes dans les Évangiles, surtout chez Luc."], ["Légiste", "Spécialiste de la Loi de Moïse, qui l’interprète et la fait appliquer."]], "l": [["Lire Marc 12:28-34", "MAR", 12, 28], ["Lire Matthieu 7:28-29", "MAT", 7, 28], ["Lire Esdras 7", "EZR", 7, 1]]}, {"t": "Les esséniens", "ic": "🏜️", "p": ["Les esséniens sont un groupe que le Nouveau Testament ne nomme jamais. On les connaît par des auteurs de l’époque, comme l’historien juif Flavius Josèphe. Ils voulaient vivre dans une grande pureté, à l’écart de ce qu’ils jugeaient corrompu, notamment le Temple de Jérusalem et ses prêtres. Beaucoup vivaient en communauté, partageaient leurs biens, et certains ne se mariaient pas.", "On les associe souvent à la communauté de Qumrân, près de la mer Morte, où l’on a retrouvé en 1947 les manuscrits de la mer Morte : de très anciennes copies de livres de l’Ancien Testament, ainsi que des règles de la communauté. Les spécialistes ne sont pas tous d’accord sur ce lien, mais c’est l’explication la plus répandue."], "u": ["Ils attendaient l’intervention de Dieu et la venue de sauveurs promis.", "Ils pratiquaient des bains rituels fréquents pour se purifier.", "Les manuscrits de la mer Morte contiennent des copies de presque tous les livres de l’Ancien Testament, plus anciennes d’environ mille ans que celles que l’on avait auparavant.", "Rien ne prouve que Jésus ou Jean-Baptiste aient appartenu à ce groupe."], "d": [["Qumrân", "Site près de la mer Morte où l’on a découvert les manuscrits."], ["Manuscrits de la mer Morte", "Rouleaux découverts à partir de 1947, parmi les plus anciens textes bibliques connus."]], "l": [["Lire Ésaïe 40:3", "ISA", 40, 3]]}, {"t": "Les zélotes", "ic": "🗡️", "p": ["« Zélote » vient d’un mot grec qui signifie « zélé, ardent ». Ce nom désigne des Juifs passionnés pour la Loi et pour la liberté de leur peuple, qui refusaient l’autorité de Rome. Selon l’historien Josèphe, un mouvement de révolte est né quand Judas le Galiléen s’est opposé au recensement romain, vers l’an 6 (Actes 5:37). Ce courant de résistance a continué jusqu’à la grande révolte de 66-70, qui s’est terminée par la destruction de Jérusalem et du Temple.", "Parmi les douze apôtres, il y a « Simon le zélote » (Luc 6:15 ; Actes 1:13), appelé aussi Simon le Cananite (Matthieu 10:4). On ne sait pas s’il appartenait à un parti armé ou s’il était simplement connu pour son ardeur religieuse. Ce qui est sûr, c’est qu’il se trouvait dans le même groupe que Matthieu, un ancien percepteur d’impôts au service de Rome : Jésus réunit autour de lui des hommes que tout opposait."], "u": ["Beaucoup attendaient un Messie qui chasserait les Romains par la force.", "Jésus a refusé cette voie : « Mon royaume n’est pas de ce monde » (Jean 18:36).", "Barabbas, que la foule demande à la place de Jésus, avait été emprisonné pour une révolte et pour meurtre (Marc 15:7)."], "d": [["Zélote", "Juif très ardent pour la Loi et pour la liberté, hostile à Rome."], ["Messie", "Le Roi promis par Dieu. Les Juifs de l’époque l’attendaient de façons très différentes."]], "l": [["Lire Luc 6:12-16", "LUK", 6, 12], ["Lire Jean 18:33-37", "JOH", 18, 33], ["Lire Actes 5:35-37", "ACT", 5, 35]]}, {"t": "Les hérodiens", "ic": "👑", "p": ["Les hérodiens ne sont pas une religion mais un parti politique : ce sont les partisans de la famille d’Hérode, que Rome avait établie pour gouverner les Juifs. Hérode le Grand régnait à la naissance de Jésus (Matthieu 2). Son fils Hérode Antipas gouvernait la Galilée : c’est lui qui a fait mettre à mort Jean-Baptiste (Marc 6:14-29), et devant qui Jésus a comparu avant sa mort (Luc 23:7-12).", "On voit les hérodiens deux fois dans les Évangiles, et à chaque fois avec leurs adversaires habituels, les pharisiens, unis contre Jésus. Ils décident ensemble de le faire périr (Marc 3:6) et ils lui posent une question piège : « Est-il permis de payer l’impôt à César ? » (Matthieu 22:15-22). Si Jésus dit non, il est accusé de révolte contre Rome ; s’il dit oui, il perd la confiance du peuple. Sa réponse : « Rendez donc à César ce qui est à César, et à Dieu ce qui est à Dieu »."], "u": ["Hérode le Grand : le roi qui reçoit les mages et fait tuer les enfants de Bethléhem (Matthieu 2).", "Hérode Antipas : tétrarque de Galilée, qui fait mourir Jean-Baptiste.", "Hérode Agrippa Ier : fait mourir l’apôtre Jacques (Actes 12).", "Hérode Agrippa II : devant qui Paul plaide sa cause (Actes 25-26)."], "d": [["Tétrarque", "Gouverneur d’une partie du pays, avec moins de pouvoir qu’un roi."], ["César", "Titre de l’empereur romain. À l’époque de Jésus : Tibère."]], "l": [["Lire Matthieu 22:15-22", "MAT", 22, 15], ["Lire Marc 6:14-29", "MAR", 6, 14], ["Lire Luc 23:6-12", "LUK", 23, 6]]}, {"t": "Les samaritains", "ic": "⛰️", "p": ["La Samarie se trouve entre la Judée, au sud, et la Galilée, au nord. Après la chute du royaume du nord en 722 avant Jésus-Christ, les Assyriens ont installé dans le pays d’autres peuples, qui ont adopté le culte du Dieu d’Israël en y mêlant leurs propres pratiques (2 Rois 17:24-41). Les Samaritains n’acceptaient que les cinq livres de Moïse, et ils adoraient sur le mont Garizim, non à Jérusalem (Jean 4:20). Les Juifs les méprisaient, et la haine était réciproque : « Les Juifs n’ont pas de relations avec les Samaritains » (Jean 4:9).", "Jésus fait justement des Samaritains des exemples. Dans la parabole du bon Samaritain, c’est l’étranger méprisé qui se montre le vrai prochain (Luc 10:25-37). Il parle à une femme samaritaine au puits de Jacob (Jean 4), et sur dix lépreux guéris, c’est un Samaritain qui revient le remercier (Luc 17:11-19). Après sa résurrection, il annonce que ses disciples seront ses témoins en Samarie (Actes 1:8), et l’Évangile y est annoncé par Philippe (Actes 8)."], "u": ["Ils ne partagent pas la foi des Juifs sur tous les points, mais ils attendent aussi le Messie (Jean 4:25).", "Un très petit nombre de Samaritains existe encore aujourd’hui, autour du mont Garizim.", "Leçon des Évangiles : l’amour du prochain dépasse les frontières."], "d": [["Samaritain", "Habitant de la Samarie, dont la foi est proche de celle des Juifs mais distincte."], ["Garizim", "Montagne sainte des Samaritains, près de Sichem."]], "l": [["Lire Luc 10:25-37", "LUK", 10, 25], ["Lire Jean 4", "JOH", 4, 1], ["Lire Actes 8:4-17", "ACT", 8, 4]]}, {"t": "Les publicains (collecteurs d’impôts)", "ic": "💰", "p": ["Les publicains sont des Juifs qui prélèvent les impôts et les taxes pour le compte de Rome. Ils étaient détestés pour deux raisons : ils travaillaient pour l’occupant, et beaucoup en profitaient pour prélever plus que nécessaire. Ils étaient donc mis dans le même groupe que les « pécheurs » : on ne mangeait pas avec eux.", "C’est avec eux que Jésus a passé du temps. Il appelle Matthieu (ou Lévi) alors qu’il est assis au bureau des taxes, et celui-ci donne un grand repas pour ses amis publicains (Matthieu 9:9-13 ; Luc 5:27-32). Il va chez Zachée, chef des publicains de Jéricho, qui décide de rendre le quadruple de ce qu’il a volé (Luc 19:1-10). Ses adversaires disent de lui qu’il est l’ami des publicains et des pécheurs (Matthieu 11:19)."], "u": ["Jean-Baptiste leur dit de ne rien exiger de plus que ce qui est fixé (Luc 3:12-13).", "Dans la parabole du pharisien et du publicain, c’est le publicain qui repart justifié : il se frappe la poitrine et demande pardon (Luc 18:9-14).", "Jésus dit : « Je ne suis pas venu appeler des justes, mais des pécheurs » (Marc 2:17)."], "d": [["Publicain", "Collecteur d’impôts au service de Rome. Très mal vu des Juifs."], ["Pécheur", "Dans les Évangiles, quelqu’un qui vit hors de la Loi aux yeux des autres."]], "l": [["Lire Luc 19:1-10", "LUK", 19, 1], ["Lire Matthieu 9:9-13", "MAT", 9, 9], ["Lire Luc 18:9-14", "LUK", 18, 9]]}, {"t": "Le Sanhédrin : le conseil suprême", "ic": "⚖️", "p": ["Le Sanhédrin est le grand conseil des Juifs, qui siège à Jérusalem. Selon la tradition juive, il comptait soixante et onze membres : le grand prêtre qui le présidait et soixante-dix autres, comme les soixante-dix anciens choisis par Moïse (Nombres 11:16). On y trouve les chefs des prêtres, qui étaient surtout sadducéens, les anciens, et les scribes, dont beaucoup étaient pharisiens. Ce conseil juge les affaires religieuses et veille à l’ordre dans le pays.", "Son pouvoir était limité par Rome : ses membres reconnaissent devant Pilate qu’il ne leur est pas permis de mettre quelqu’un à mort (Jean 18:31). C’est devant le Sanhédrin que Jésus est jugé la nuit de son arrestation (Matthieu 26:57-68). Plus tard, les apôtres Pierre et Jean y comparaissent (Actes 4:5-22), puis Étienne (Actes 6:12–7:60) et Paul (Actes 23:1-10)."], "u": ["Nicodème, membre du conseil, prend la défense de Jésus (Jean 7:50-51).", "Joseph d’Arimathée, membre respecté du conseil, demande le corps de Jésus pour l’ensevelir (Marc 15:43).", "Devant Paul, les pharisiens et les sadducéens du conseil se divisent sur la résurrection (Actes 23:6-9)."], "d": [["Sanhédrin", "Le conseil suprême des Juifs à Jérusalem, présidé par le grand prêtre."], ["Ancien", "Notable respecté, chef de famille ou de clan, membre du conseil."]], "l": [["Lire Matthieu 26:57-68", "MAT", 26, 57], ["Lire Actes 5:17-42", "ACT", 5, 17], ["Lire Actes 23:1-10", "ACT", 23, 1]]}, {"t": "Prêtres, grands prêtres et lévites", "ic": "🕍", "p": ["Dans la Loi de Moïse, Dieu choisit la tribu de Lévi pour le servir. Les prêtres descendent d’Aaron, le frère de Moïse (Exode 28-29) : ils offrent les sacrifices au Temple. Les lévites, issus de la même tribu, les aident : ils gardent le Temple, chantent les psaumes et assurent le service (Nombres 3 ; 1 Chroniques 23). Les prêtres étaient répartis en vingt-quatre groupes qui se relayaient au Temple. Zacharie, le père de Jean-Baptiste, était prêtre et exerçait son service quand l’ange lui est apparu (Luc 1:5-23).", "À la tête, le grand prêtre est le seul à entrer une fois par an dans le lieu très saint, le jour des Expiations (Lévitique 16). Au temps de Jésus, Rome et les Hérodes nomment et changent les grands prêtres à leur gré. On voit surtout Anne et son gendre Caïphe (Luc 3:2 ; Jean 18:13). Dans les Évangiles, l’expression « les chefs des prêtres » désigne l’ensemble des responsables des grandes familles sacerdotales."], "u": ["Dans la parabole du bon Samaritain, un prêtre et un lévite passent sans s’arrêter (Luc 10:31-32).", "Barnabas, compagnon de Paul, était lévite (Actes 4:36).", "Après la résurrection de Jésus, beaucoup de prêtres ont obéi à la foi (Actes 6:7).", "L’épître aux Hébreux présente Jésus comme le grand prêtre parfait, qui s’est offert une fois pour toutes (Hébreux 4:14-16 ; 9:11-14)."], "d": [["Prêtre", "Descendant d’Aaron qui offre les sacrifices au Temple."], ["Lévite", "Membre de la tribu de Lévi qui aide les prêtres dans le service du Temple."], ["Grand prêtre", "Chef des prêtres, qui préside au Temple et au Sanhédrin."], ["Expiation", "Pardon des péchés obtenu par un sacrifice. Yom Kippour est le jour des Expiations."]], "l": [["Lire Luc 1:5-23", "LUK", 1, 5], ["Lire Lévitique 16", "LEV", 16, 1], ["Lire Hébreux 4:14-16", "HEB", 4, 14]]}, {"t": "Les traductions et le canon", "p": ["Les textes d’origine ont été traduits très tôt. Deux traductions anciennes sont célèbres : la Septante, traduction grecque de la Bible hébraïque, à partir du IIIe siècle avant notre ère, et la Vulgate, traduction latine de Jérôme, vers la fin du IVe siècle.", "Le canon est la liste des livres reconnus comme faisant partie de la Bible. Toutes les Églises n’ont pas exactement la même liste."], "u": ["Les Bibles protestantes comptent 66 livres.", "Les Bibles catholiques en comptent 73 : elles ajoutent sept livres à l’Ancien Testament, dits deutérocanoniques (par exemple Tobie, Sagesse, Siracide, Maccabées).", "Les Églises orthodoxes ont un canon un peu plus large, qui varie selon les traditions."], "p2": ["Cette application propose les 66 livres du canon protestant, et deux traductions tombées dans le domaine public : la Louis Segond 1910 (en français) et la World English Bible (en anglais). Le sélecteur de version, en haut de la page de lecture, permet de passer de l’une à l’autre."], "ic": "🌍"}, {"t": "La Pâque : le grand passage", "ic": "🐑", "p": ["Le mot « Pâque » vient de l’hébreu pessah, qui évoque l’idée de « passer par-dessus » pour épargner. Il rappelle la nuit où Dieu a délivré le peuple d’Israël de l’esclavage en Égypte (Exode 12). Chaque famille devait sacrifier un agneau et mettre son sang sur les montants de la porte : là où se trouvait ce signe, le malheur passait sans entrer.", "Cette fête est devenue un grand repère de toute la Bible : un peuple esclave est libéré, traverse la mer et marche vers une vie nouvelle. Le Nouveau Testament y reconnaît l’histoire de Jésus. Jean-Baptiste l’appelle « l’Agneau de Dieu » (Jean 1:29), et l’apôtre Paul écrit : « Christ, notre Pâque, a été immolé » (1 Corinthiens 5:7).", "La Pâque relie les grands thèmes des leçons suivantes :"], "u": ["Le salut : un agneau est offert, son sang protège, un peuple est délivré de l’esclavage.", "L’amour : Dieu prend l’initiative et délivre un peuple qui ne l’a pas mérité.", "La repentance : quitter l’Égypte, c’est quitter l’ancienne vie et se mettre en route.", "Le baptême : la traversée de la mer est l’image d’un passage de la mort à la vie (1 Corinthiens 10:1-2)."], "p2": ["Pâque ou Pâques ? En français, « la Pâque » désigne la fête juive de la sortie d’Égypte, et « Pâques » la fête chrétienne qui célèbre la résurrection de Jésus (Luc 24). Les deux se rejoignent : c’est pendant la Pâque que Jésus a pris son dernier repas avec ses disciples (Luc 22:15), avant de mourir puis de ressusciter."], "d": [["Pessah", "Mot hébreu pour « Pâque ». Il évoque le fait de passer par-dessus, d’épargner."], ["Agneau pascal", "L’agneau sacrifié lors de la Pâque. Le Nouveau Testament y voit une image de Jésus."], ["Pains sans levain", "Pain mangé pendant la semaine qui suit la Pâque, en souvenir du départ précipité d’Égypte."]], "l": [["Lire Exode 12", "EXO", 12, 1], ["Lire Luc 22:15", "LUK", 22, 15], ["Lire Jean 1:29", "JOH", 1, 29], ["Lire 1 Corinthiens 5:7", "1CO", 5, 7]]}, {"t": "Le salut : être sauvé", "ic": "🕊️", "p": ["Dans la Bible, « sauver » veut dire délivrer d’un danger mortel. Le nom de Jésus, en hébreu Yeshoua, signifie « l’Éternel sauve ». L’ange explique à Joseph que Jésus sauvera son peuple de ses péchés (Matthieu 1:21).", "Sauvé de quoi ? Du péché, de la séparation d’avec Dieu et de la mort. Sauvé par qui ? Par Jésus-Christ, qui a donné sa vie sur la croix. Sauvé comment ? Le Nouveau Testament répond que c’est un don : « C’est par la grâce que vous êtes sauvés, par le moyen de la foi » (Éphésiens 2:8)."], "u": ["La grâce : Dieu donne ce que personne ne peut mériter (Éphésiens 2:8-9).", "La foi : faire confiance à Jésus et à ce qu’il a fait (Romains 10:9).", "Un nom unique : « Il n’y a de salut en aucun autre » (Actes 4:12).", "Une vie nouvelle : le salut commence dès maintenant, il se vit chaque jour et sera complet au retour du Christ."], "p2": ["Les Églises chrétiennes sont d’accord sur l’essentiel : le salut vient de Dieu, par Jésus-Christ. Elles ne mettent pas toutes l’accent de la même manière sur la place de la foi, des œuvres et des sacrements. Lisez les textes par vous-même et comparez."], "d": [["Salut", "Délivrance du péché et de la mort, offerte par Dieu en Jésus-Christ."], ["Grâce", "Une faveur gratuite : Dieu donne sans que l’on puisse le mériter."], ["Foi", "Confiance donnée à Dieu et à sa parole."], ["Rédemption", "Libération obtenue en payant un prix, comme on rachète un esclave."]], "l": [["Lire Jean 3:16", "JOH", 3, 16], ["Lire Éphésiens 2:8", "EPH", 2, 8], ["Lire Romains 10:9", "ROM", 10, 9]]}, {"t": "L’amour : le cœur du message", "ic": "❤️", "p": ["Le Nouveau Testament a été écrit en grec, qui a plusieurs mots pour dire « aimer ». Le plus important dans la Bible est agapè : un amour qui se donne, sans rien attendre en retour. C’est celui que Dieu a pour les hommes : « Dieu a tant aimé le monde qu’il a donné son Fils unique » (Jean 3:16). Dans l’Ancien Testament, un mot hébreu y correspond : hesed, la bonté fidèle de Dieu, qui reste attaché à son peuple.", "Jésus résume toute la Loi en deux commandements : aimer Dieu de tout son cœur, et aimer son prochain comme soi-même (Matthieu 22:37-40). Ce double amour est la mesure de toute la vie chrétienne."], "u": ["Agapè : l’amour qui se donne (Jean 3:16 ; Romains 5:8).", "Philia : l’amitié, l’affection entre proches (Jean 11:3).", "Hesed : la bonté fidèle de Dieu dans l’Ancien Testament (Psaume 136).", "« Dieu est amour » (1 Jean 4:8).", "L’amour en actes : 1 Corinthiens 13 décrit à quoi ressemble un vrai amour."], "p2": ["L’amour n’est pas seulement un sentiment. Jésus donne à ses disciples un commandement nouveau : s’aimer les uns les autres comme il les a aimés (Jean 13:34). Il a montré cet amour en donnant sa vie, ce que la Pâque annonçait déjà."], "d": [["Agapè", "Mot grec pour l’amour qui se donne, sans condition."], ["Philia", "Mot grec pour l’amitié et l’affection."], ["Hesed", "Mot hébreu pour la bonté fidèle de Dieu, attachée à son alliance."], ["Prochain", "Toute personne que l’on rencontre et à qui l’on peut faire du bien (Luc 10:25-37)."]], "l": [["Lire Jean 3:16", "JOH", 3, 16], ["Lire 1 Corinthiens 13", "1CO", 13, 1], ["Lire 1 Jean 4:8", "1JO", 4, 8]]}, {"t": "La repentance : changer de direction", "ic": "🔄", "p": ["Se repentir ne veut pas dire seulement avoir des regrets. En hébreu, le verbe shouv signifie « faire demi-tour, revenir ». En grec, metanoia veut dire « changer sa manière de penser ». La repentance, c’est donc reconnaître que l’on s’est éloigné de Dieu, puis revenir vers lui et changer de chemin.", "Jésus commence son message par cet appel : « Le temps est accompli, et le royaume de Dieu est proche. Repentez-vous, et croyez à la bonne nouvelle » (Marc 1:15). L’histoire du fils perdu (Luc 15:11-32) la montre bien : le jeune homme prend conscience de sa faute, se lève et retourne chez son père, qui court à sa rencontre."], "u": ["Reconnaître : dire la vérité sur ses fautes devant Dieu (Psaume 51).", "Regretter : « la tristesse selon Dieu produit une repentance à salut » (2 Corinthiens 7:10).", "Revenir : se tourner vers Dieu de tout son cœur (Joël 2:12-13).", "Changer : produire des fruits qui prouvent le changement (Luc 3:8)."], "p2": ["La repentance n’est pas réservée au début de la vie chrétienne : c’est une attitude de retour vers Dieu, à tout moment. Elle précède souvent le baptême (Actes 2:38) et ouvre la porte au pardon (1 Jean 1:9)."], "d": [["Repentance", "Demi-tour : reconnaître sa faute, se tourner vers Dieu et changer de conduite."], ["Metanoia", "Mot grec qui signifie « changement de pensée »."], ["Shouv", "Verbe hébreu qui signifie « revenir, faire demi-tour »."], ["Pardon", "Dieu efface la faute de celui qui revient à lui."]], "l": [["Lire Luc 15", "LUK", 15, 11], ["Lire Psaume 51", "PSA", 51, 1], ["Lire Actes 2:38", "ACT", 2, 38]]}, {"t": "Le baptême : plonger dans une vie nouvelle", "ic": "💧", "p": ["Le mot « baptême » vient du grec baptizô, qui signifie « plonger, immerger ». Avant Jésus, Jean-Baptiste appelait les gens à se repentir et à se faire baptiser dans le Jourdain. Jésus lui-même a été baptisé, et une voix du ciel a dit : « Celui-ci est mon Fils bien-aimé » (Matthieu 3:17). À la fin de l’Évangile de Matthieu, il envoie ses disciples faire des disciples de toutes les nations, en les baptisant « au nom du Père, du Fils et du Saint-Esprit » (Matthieu 28:19).", "Paul explique le sens du baptême : en descendant dans l’eau, le croyant s’associe à la mort et à l’ensevelissement de Jésus, puis il en ressort pour marcher dans une vie nouvelle (Romains 6:3-4). C’est le lien avec la Pâque : comme Israël a traversé la mer pour sortir de l’esclavage, le baptisé passe de l’ancienne vie à la nouvelle."], "u": ["Le baptême est un signe public : il montre que l’on appartient au Christ.", "Il est lié à la repentance et à la foi (Actes 2:38 ; Marc 16:16).", "Il parle de pardon et de purification (Actes 22:16).", "Jean-Baptiste annonce aussi que Jésus baptisera du Saint-Esprit (Matthieu 3:11)."], "p2": ["Les Églises ne pratiquent pas toutes le baptême de la même façon. Certaines baptisent les personnes qui ont décidé de croire, le plus souvent par immersion. D’autres baptisent aussi les petits enfants, par immersion ou en versant de l’eau. Toutes s’appuient sur la Bible, avec leurs raisons : renseignez-vous auprès de votre Église."], "d": [["Baptizô", "Verbe grec qui signifie « plonger, immerger »."], ["Immersion", "Baptême où la personne est plongée entièrement dans l’eau."], ["Jourdain", "Fleuve où Jean-Baptiste baptisait et où Jésus a été baptisé."]], "l": [["Lire Matthieu 3", "MAT", 3, 13], ["Lire Romains 6", "ROM", 6, 3], ["Lire Matthieu 28:19", "MAT", 28, 19]]}, {"t": "Les fêtes de l’Éternel : le calendrier de Dieu", "ic": "🎺", "p": ["Dans Lévitique 23, Dieu donne à Israël ses « fêtes », des rendez-vous fixés dans l’année pour se souvenir de ce qu’il a fait. On les appelle aujourd’hui les fêtes juives. Elles suivent le calendrier hébreu (voir la leçon sur les mois) et rythment la vie du peuple : les récoltes, le souvenir de la délivrance, l’adoration.", "Trois d’entre elles sont des pèlerinages : toute la nation montait à Jérusalem pour la Pâque, la Pentecôte et la fête des Tentes (Deutéronome 16:16). Jésus les a célébrées, et les premiers chrétiens les connaissaient bien."], "u": ["Le sabbat (chaque semaine) : un jour de repos, en souvenir de la création (Exode 20:8-11) et de la délivrance (Deutéronome 5:15).", "La Pâque (14 Nisan) et les pains sans levain (15-21 Nisan) : la sortie d’Égypte.", "Les prémices (lendemain du sabbat de la Pâque) : les premiers fruits de la moisson. Paul dit que Christ est « les prémices de ceux qui sont morts » (1 Corinthiens 15:20).", "La Pentecôte, ou Chavouot (cinquante jours après) : la moisson du blé. Les chrétiens y voient le don du Saint-Esprit (Actes 2).", "Les Trompettes (1er Tishri) : un appel solennel au début du septième mois.", "Yom Kippour, le jour des Expiations (10 Tishri) : un jour de jeûne et de pardon pour le peuple.", "La fête des Tentes, ou Soukkot (15-21 Tishri) : on habite sous des cabanes en souvenir du désert. C’est pendant cette fête que Jésus déclare : « Si quelqu’un a soif, qu’il vienne à moi » (Jean 7:37)."], "p2": ["Deux autres fêtes sont mentionnées dans la Bible sans figurer dans Lévitique 23 : Pourim, qui rappelle la délivrance du peuple au temps de la reine Esther (Esther 9), et la Dédicace, ou Hanoucca, à laquelle Jésus a assisté (Jean 10:22). Beaucoup de chrétiens voient dans les fêtes de l’Éternel une annonce de l’œuvre de Jésus. Les Églises ne les observent pas toutes, et ne les comprennent pas toutes de la même manière."], "d": [["Fête", "Un rendez-vous fixé par Dieu dans l’année, pour se souvenir et adorer."], ["Chavouot", "Fête des Semaines, appelée Pentecôte en grec (« cinquantième »)."], ["Soukkot", "Fête des Tentes ou des Cabanes."], ["Yom Kippour", "Jour des Expiations, le jour du pardon."], ["Pèlerinage", "Voyage vers un lieu saint pour une fête ; ici, vers Jérusalem."]], "l": [["Lire Lévitique 23", "LEV", 23, 1], ["Lire Deutéronome 16", "DEU", 16, 1], ["Lire Jean 7:37", "JOH", 7, 37]]}, {"t": "Les mois de la Bible et leur sens", "ic": "🗓️", "p": ["La Bible utilise le calendrier hébreu. Le mois suit la lune : il commence à la nouvelle lune et dure vingt-neuf ou trente jours. Pour que les fêtes tombent toujours à la bonne saison, on ajoute un mois supplémentaire sept fois tous les dix-neuf ans. L’année religieuse commence au printemps, avec le mois de la Pâque : « Ce mois sera pour vous le premier des mois » (Exode 12:2).", "Dans la Bible, les mois sont très souvent seulement numérotés : « le premier mois », « le septième mois ». Les noms que l’on utilise aujourd’hui (Nisan, Tishri…) viennent de Babylone et apparaissent dans des livres tardifs comme Néhémie, Zacharie et Esther. Voici les douze mois, avec ce que la Bible y rattache."], "u": ["1. Nisan (mars-avril) : le mois de la Pâque, des pains sans levain et des prémices. Il s’appelle aussi Abib, le « mois des épis » (Exode 13:4).", "2. Iyar (avril-mai) : on y célèbre la « seconde Pâque » pour ceux qui n’avaient pas pu la faire à temps (Nombres 9:10-11). Il porte aussi le nom de Ziv (1 Rois 6:1).", "3. Sivan (mai-juin) : la Pentecôte, ou fête des Semaines. La tradition juive y place le don de la Loi au Sinaï.", "4. Tammouz (juin-juillet) : le « jeûne du quatrième mois » (Zacharie 8:19), en souvenir de la chute de Jérusalem (Jérémie 39:2).", "5. Av (juillet-août) : le « jeûne du cinquième mois » (Zacharie 7:3-5) rappelle l’incendie du Temple (2 Rois 25:8-9).", "6. Elul (août-septembre) : un mois de préparation avant les grandes fêtes. Les murs de Jérusalem sont achevés un 25 Elul (Néhémie 6:15).", "7. Tishri (septembre-octobre) : le mois des grandes fêtes (Trompettes, Yom Kippour, fête des Tentes). Il s’appelle aussi Ethanim : Salomon y inaugure le Temple (1 Rois 8:2).", "8. Heshvan (octobre-novembre) : appelé Boul (1 Rois 6:38), c’est le mois où s’achève la construction du Temple.", "9. Kislev (novembre-décembre) : le mois de Hanoucca, la Dédicace (Jean 10:22). Néhémie y apprend la situation difficile de Jérusalem (Néhémie 1:1).", "10. Tevet (décembre-janvier) : Esther est conduite chez le roi (Esther 2:16). Le siège de Jérusalem commence un dixième mois (2 Rois 25:1).", "11. Shevat (janvier-février) : Moïse prononce ses derniers discours (Deutéronome 1:3), et Zacharie reçoit ses visions (Zacharie 1:7).", "12. Adar (février-mars) : Pourim, la délivrance du peuple au temps d’Esther (Esther 9:1, 21)."], "p2": ["Les dates changent chaque année par rapport à notre calendrier, car le calendrier hébreu suit la lune : les périodes indiquées sont donc approximatives. Les noms des mois sont d’origine babylonienne et le sens exact de certains est discuté. C’est pourquoi cette leçon donne surtout ce que la Bible rattache à chaque mois."], "d": [["Nouvelle lune", "Début du mois hébreu, jour de fête et de sacrifices (Nombres 28:11)."], ["Mois intercalaire", "Mois ajouté sept fois en dix-neuf ans pour garder le calendrier en accord avec les saisons."], ["Abib", "Ancien nom de Nisan : le « mois des épis »."]], "l": [["Lire Exode 12:1-2", "EXO", 12, 1], ["Lire Esther 9", "EST", 9, 1], ["Lire Néhémie 1", "NEH", 1, 1]]}, {"t": "Les mesures de longueur : coudée, empan, stade", "ic": "📐", "p": ["Au temps de la Bible, on mesure avec le corps humain plutôt qu’avec un mètre. La coudée est la mesure principale : la distance du coude au bout du majeur, soit environ 45 centimètres. L’empan est la longueur de la main ouverte, du pouce au petit doigt, environ 22 centimètres : une demi-coudée. La paume est la largeur de la main, quatre doigts, environ 7,5 centimètres. Le doigt vaut environ 2 centimètres.", "Ces mesures servent à donner des dimensions précises. L’arche de Noé mesurait trois cents coudées de long, soit environ 135 mètres (Genèse 6:15). Goliath était haut de « six coudées et un empan » (1 Samuel 17:4), c’est-à-dire environ 2,9 mètres. Le prophète Ézéchiel utilise une coudée plus longue d’une paume, d’environ 52 centimètres (Ézéchiel 40:5)."], "u": ["Doigt : environ 2 cm.", "Paume : 4 doigts, environ 7,5 cm.", "Empan : 3 paumes, environ 22 cm.", "Coudée : 6 paumes, environ 45 cm.", "Roseau (ou canne à mesurer) : 6 coudées longues, environ 3 m (Ézéchiel 40:5).", "Brasse : la longueur des bras étendus, environ 1,8 m (Actes 27:28).", "Stade : environ 185 m. Emmaüs est à soixante stades de Jérusalem, soit environ 11 km (Luc 24:13).", "Mille : environ 1,5 km (Matthieu 5:41).", "Chemin d’un sabbat : deux mille coudées, environ 900 m (Actes 1:12)."], "p2": ["Ces équivalents sont des approximations. La coudée variait selon les lieux et les époques, et les spécialistes proposent des valeurs un peu différentes. Retenez surtout l’ordre de grandeur."], "d": [["Coudée", "Du coude au bout du majeur, environ 45 cm."], ["Empan", "Longueur de la main ouverte, environ 22 cm."], ["Stade", "Unité grecque et romaine de distance, environ 185 m."]], "l": [["Lire Genèse 6:14-16", "GEN", 6, 14], ["Lire 1 Samuel 17:4", "1SA", 17, 4], ["Lire Luc 24:13", "LUK", 24, 13]]}, {"t": "Les mesures de capacité : éphah, bath, hin", "ic": "🏺", "p": ["Pour mesurer le grain, la farine, l’huile ou le vin, on utilise des mesures de capacité. L’éphah sert pour les grains et les solides, le bath pour l’huile et le vin. Les deux ont la même contenance, environ 22 litres selon les estimations (certains spécialistes proposent plutôt une quarantaine de litres). Le cor, ou homer, en vaut dix, environ 220 litres (Ézéchiel 45:11).", "Les petites mesures servent pour les offrandes. L’omer, un dixième d’éphah (environ 2,2 litres), est la ration de manne ramassée par personne chaque jour (Exode 16:16, 36). Le hin, environ 3,7 litres, sert pour l’huile et le vin des sacrifices (Exode 29:40)."], "u": ["Log : environ 0,3 litre (Lévitique 14:10).", "Cab : environ 1,2 litre (2 Rois 6:25).", "Omer : environ 2,2 litres.", "Hin : environ 3,7 litres, soit douze logs.", "Séa : environ 7,3 litres, le tiers d’un éphah.", "Éphah et bath : environ 22 litres.", "Cor ou homer : environ 220 litres.", "Dans le Nouveau Testament, la « mesure » (séa) : le levain est mis dans trois mesures de farine, environ 22 litres (Matthieu 13:33).", "Boisseau : environ 9 litres. Jésus dit qu’on ne met pas une lampe sous le boisseau (Matthieu 5:15).", "Métrète : environ 40 litres. Les six jarres de Cana contenaient chacune deux ou trois métrètes, soit en tout plus de 450 litres (Jean 2:6).", "Chénice : environ 1 litre. Dans l’Apocalypse, une chénice de blé coûte un denier (Apocalypse 6:6)."], "p2": ["Ces valeurs sont des estimations. Les spécialistes évaluent par exemple l’éphah entre 22 et 40 litres. L’essentiel est de comprendre l’ordre de grandeur : le miracle de Cana, par exemple, concerne une très grande quantité de vin."], "d": [["Éphah", "Mesure pour les grains, environ 22 litres."], ["Bath", "Mesure pour les liquides, de même contenance que l’éphah."], ["Omer", "Un dixième d’éphah : la ration de manne d’une personne."], ["Boisseau", "Récipient d’environ 9 litres, sous lequel on ne cache pas une lampe (Matthieu 5:15)."]], "l": [["Lire Exode 16:16-36", "EXO", 16, 16], ["Lire Matthieu 13:33", "MAT", 13, 33], ["Lire Jean 2:1-11", "JOH", 2, 1]]}, {"t": "Poids et monnaies : sicle, talent, denier", "ic": "🧮", "p": ["Dans l’Ancien Testament, l’argent et l’or ne sont pas d’abord comptés en pièces, mais pesés. Le sicle est l’unité principale : environ 11,5 grammes. Le béqa en est la moitié et sert pour l’impôt du Sanctuaire (Exode 38:26). La mine vaut cinquante sicles, environ 570 grammes, et le talent trois mille sicles, soit environ 34 kilos (Exode 38:25-26). Quand Abraham achète le champ de Machpéla, il pèse quatre cents sicles d’argent (Genèse 23:15-16).", "Au temps de Jésus, on utilise les monnaies de l’empire romain et du monde grec. Le denier romain est le salaire d’une journée de travail (Matthieu 20:2). La drachme grecque vaut à peu près un denier : la femme qui perd une de ses dix drachmes la cherche partout (Luc 15:8-10). Un statère vaut quatre drachmes : il suffit pour payer l’impôt du Temple de Jésus et de Pierre (Matthieu 17:24-27). Les plus petites pièces sont le lepton (la pite) et le quadrant : la veuve met dans le tronc deux lepta, tout ce qu’elle possède (Marc 12:41-44)."], "u": ["Gérah : un vingtième de sicle, environ 0,6 g.", "Béqa : un demi-sicle, environ 5,7 g.", "Sicle : environ 11,5 g.", "Mine : 50 sicles, environ 570 g (cette valeur varie selon les époques).", "Talent : 3 000 sicles, environ 34 kg.", "Livre romaine : environ 327 g. Marie verse une livre de parfum de nard pur, très précieux (Jean 12:3).", "Denier : le salaire d’un ouvrier pour un jour (Matthieu 20:2).", "Mine grecque : cent drachmes. Dans la parabole des mines, chaque serviteur en reçoit une (Luc 19:13).", "Talent (monnaie) : environ 6 000 deniers, soit une vingtaine d’années de salaire (Matthieu 25:15)."], "p2": ["Il est difficile de convertir ces valeurs en monnaies d’aujourd’hui. Pour comprendre une somme, comparez-la au salaire d’une journée, le denier. Ainsi, le parfum de Marie vaut plus de trois cents deniers (Jean 12:5), environ un an de travail."], "d": [["Sicle", "Poids d’environ 11,5 g, utilisé pour peser l’argent."], ["Talent", "Le plus grand poids : environ 34 kg."], ["Denier", "Pièce romaine, le salaire d’une journée de travail."], ["Lepton (pite)", "La plus petite pièce, la moitié d’un quadrant."]], "l": [["Lire Matthieu 20:1-16", "MAT", 20, 1], ["Lire Marc 12:41-44", "MAR", 12, 41], ["Lire Matthieu 25:14-30", "MAT", 25, 14]]}, {"t": "Le temps : heures, veilles et jours", "ic": "⏳", "p": ["Dans la Bible, le jour juif commence au coucher du soleil : la Genèse compte chaque jour en commençant par le soir (Genèse 1:5). C’est pourquoi le sabbat commence le vendredi soir. La journée de lumière est divisée en douze heures, comptées à partir du lever du soleil, vers six heures du matin (Jean 11:9). La « troisième heure » correspond donc à environ neuf heures (Actes 2:15), la « sixième heure » à midi (Jean 4:6), et la « neuvième heure » à environ quinze heures, l’heure de la
