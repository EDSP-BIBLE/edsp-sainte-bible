html{background:#1E2A18}

.sw{position:absolute;top:.9rem;right:1.25rem}

.v{display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.v .n{flex:none;width:2.2rem;color:var(--gold);font-weight:600;text-align:right}
.v .t{flex:1;font-family:Newsreader,Georgia,serif;line-height:1.6}
.v .f{flex:none;min-width:2.5rem;border:0;background:none;font-size:1.3rem;color:var(--gold)}
.reset{margin-top:2rem;background:none;border:0;color:var(--mut);text-decoration:underline}
.cb{position:relative}
.cb>.fi{display:none;position:absolute;left:.75rem;top:.9rem;width:1.5rem;height:1.1rem}
.cb.sel>.fi{display:block}.cb.sel input{padding-left:2.9rem}

.verse.card{border-left:1.5px solid #D6B75C;padding:1.1rem 1.2rem}
#vs.card{padding:.4rem 1rem}

const shut=()=>{ul.hidden=true;q.setAttribute("aria-expanded","false");act=-1};
const close=()=>{shut();q.value=h.value?nm(h.value):""};
const pick=c=>{setSel(c);shut()};
q.oninput=()=>{h.value="";a.querySelector("#dial").textContent="+";box.classList.remove("sel");act=-1;draw()};
q.onfocus=()=>{q.select();draw()};
q.onclick=()=>{if(ul.hidden)draw()};
q.onblur=()=>setTimeout(close,150);
ul.onmousedown=e=>{const li=e.target.closest("li[data-c]");if(li){e.preventDefault();pick(li.dataset.c)}};
q.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(ul.hidden)draw();act=Math.max(0,Math.min(shown.length-1,act+(e.key==="ArrowDown"?1:-1)));[...ul.children].forEach((li,i)=>li.setAttribute("aria-selected",i===act));const o=ul.children[act];if(o)o.scrollIntoView({block:"nearest"})}
else if(e.key==="Enter"&&!ul.hidden&&shown.length&&(act>=0||shown.length===1)){e.preventDefault();pick(shown[act>=0?act:0][0])}
else if(e.key==="Escape")close()};
setSel(sel)}
const viewCheck=()=>`<main>${sw()}<h1>${t("chk")}</h1><p>${t("chkp")}<b>${esc(S.email)}</b>${t("chkq")}</p><button class="lnk" id="toLog">${t("toLog")}</button></main>`;
const viewNew=()=>`<main>${sw()}<h1>${t("newpw")}</h1><div class="card"><form id="f" novalidate>${field("pw",t("pw")+` <span class="opt">(${t("pwh")})</span>`,"password","","new-password")}<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("save")}</button></form></div></main>`;
const viewWelcome=()=>`<main>${sw()}<h1>${t("hi")}${esc(S.user.user_metadata.pseudo||"")}</h1><div class="verse card"><q>${t("verse")}</q><cite>${t("ref")}</cite></div><button class="go" id="enter">${t("enter")}</button></main>`;
function viewBible(){
const nm=S.lang==="fr"?"nom_fr":"nom_en",B=S.books||[],cur=B.find(b=>b.code===S.book)||{nb_chapitres:1},bn=c=>(B.find(b=>b.code===c)||{})[nm]||c;
const opt=B.map(b=>`<option value="${b.code}" ${b.code===S.book?"selected":""}>${esc(b[nm])}</option>`).join("");
const chs=Array.from({length:cur.nb_chapitres},(_,i)=>`<option ${i+1===S.chap?"selected":""}>${i+1}</option>`).join("");
const vs=S.res?(S.res.map(r=>`<div class="v rs" data-b="${r.livre}" data-c="${r.chapitre}" data-v="${r.verset}" tabindex="0" role="button"><span class="t"><b>${esc(bn(r.livre))} ${r.chapitre}:${r.verset}</b> — ${hl(r.texte,S.q)}</span></div>`).join("")||`<p>${t("noRes")}</p>`)
:S.verses===null?`<p>${t("loading")}</p>`:S.verses.map(v=>{const ref=S.book+"."+S.chap+"."+v.verset,on=S.fav.includes(ref);return `<div class="v" id="v${v.verset}"><span class="n">${v.verset}</span><span class="t">${S.hl?hl(v.texte,S.hl):esc(v.texte)}</span><button class="f" data-r="${ref}" aria-pressed="${on}" aria-label="${t("fav")} ${v.verset}">${on?"★":"☆"}</button></div>`}).join("");
return `<header class="bar"><b>EDSP-Sainte Bible</b><div class="tools"><button id="sm" aria-label="A−">A−</button><button id="bg" aria-label="A+">A+</button><button id="th" aria-label="Thème">◐</button><button id="lg" aria-label="Français / English">${S.lang==="fr"?"EN":"FR"}</button></div></header>
<main class="wide"><form id="sf" role="search" class="card"><label for="q" class="opt" style="margin-top:0">${t("srchB")}</label><div style="display:flex;gap:.5rem"><input id="q" type="search" value="${esc(S.q)}"><button class="go" style="width:auto;margin:0;padding:0 1.2rem" type="submit">${t("srch")}</button></div></form>
${S.res?`<p style="margin-top:1rem">${S.res.length}${S.res.length>=50?"+":""} ${t("res")} <button class="lnk" id="bk0">${t("back")}</button></p>`:`<div style="display:flex;gap:.5rem;margin-top:1rem"><select id="bk" aria-label="${t("bk")}">${opt}</select><select id="cp" aria-label="${t("ch")}" style="max-width:6rem">${chs}</select></div><h1 style="margin-top:1rem">${esc(bn(S.book))} ${S.chap}</h1>${S.lang==="en"?`<p>${t("enNote")}</p>`:""}`}
<div id="vs" class="card" style="font-size:${S.size}rem">${vs}</div>
${S.res?"":`<div style="display:flex;justify-content:space-between"><button class="lnk" id="pv">‹ ${t("prv")}</button><button class="lnk" id="nx">${t("nxt")} ›</button></div>`}
<button class="reset" id="out">${t("out")}</button></main>`}
const step=d=>{const B=S.books||[],i=B.findIndex(b=>b.code===S.book);if(i<0)return;let c=S.chap+d;if(c<1){if(i>0){S.book=B[i-1].code;c=B[i-1].nb_chapitres}else c=1}else if(c>B[i].nb_chapitres){if(i<B.length-1){S.book=B[i+1].code;c=1}else c=B[i].nb_chapitres}S.chap=c;S.hl="";scrollTo(0,0);loadChap()};
async function loadBooks(){if(S.books)return;const {data}=await sb.from("livres").select("code,ordre,nom_fr,nom_en,nb_chapitres").order("ordre");S.books=data||[]}
async function loadChap(){S.res=null;S.verses=null;render();await loadBooks();const {data,error}=await sb.from("versets").select("verset,texte").eq("version","LSG").eq("livre",S.book).eq("chapitre",S.chap).order("verset");S.verses=error?[]:data;save();render();if(S.jump){const e=document.getElementById("v"+S.jump);if(e){e.scrollIntoView({block:"center"});e.style.background="var(--card)"}S.jump=0}}
async function doSearch(q){q=q.trim();S.q=q;S.hl="";if(!q){S.res=null;render();return}const {data,error}=await sb.from("versets").select("livre,chapitre,verset,texte").eq("version","LSG").textSearch("texte",q,{config:"french",type:"websearch"}).limit(50);S.res=error?[]:data;render()}
const enterBible=()=>{S.screen="bible";S.res=null;S.verses=null;render();loadChap()};
function render(d={}){theme();document.documentElement.lang=S.lang;document.getElementById("tag").textContent=t("tag");
const a=document.getElementById("app");
if(!CFG){a.innerHTML=`<main><h1>EDSP-Sainte Bible</h1><div class="err">${t("cfg")}</div></main>`;return}
const V2={login:viewLogin,reg:viewReg,check:viewCheck,newpw:viewNew,welcome:viewWelcome,bible:viewBible};
a.innerHTML=V2[S.screen](d);
const $=s=>a.querySelector(s),on=(s,f)=>{const e=$(s);if(e)e.onclick=f},st=m=>{const e=$("#st");if(e)e.textContent=m};
const go=s=>{S.screen=s;render();scrollTo(0,0)};
on("#lg",()=>{const d=$("#f")?draft():{};S.lang=S.lang==="fr"?"en":"fr";save();render(d)});
on("#toReg",()=>go("reg"));on("#toLog",()=>go("login"));
on("#enter",()=>{try{localStorage.setItem("welcomed_"+S.user.id,"1")}catch(e){}enterBible()});
on("#sm",()=>{S.size=Math.max(.9,S.size-.1);save();$("#vs").style.fontSize=S.size+"rem"});
on("#bg",()=>{S.size=Math.min(2,S.size+.1);save();$("#vs").style.fontSize=S.size+"rem"});
on("#th",()=>{const cur=S.theme||"dark";S.theme=cur==="dark"?"light":"dark";save();theme()});
on("#out",()=>sb.auth.signOut());
on("#fg",async()=>{const m=$("#email").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$("#e-email").textContent=t("eMail");return}
await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});st(t("sent"))});
a.querySelectorAll(".f").forEach(b=>b.onclick=async()=>{const ref=b.dataset.r,has=S.fav.includes(ref);
const r=has?await sb.from("favoris").delete().eq("user_id",S.user.id).eq("ref",ref):await sb.from("favoris").insert({user_id:S.user.id,ref});
if(r.error)return;S.fav=has?S.fav.filter(x=>x!==ref):[...S.fav,ref];b.setAttribute("aria-pressed",!has);b.textContent=has?"☆":"★"});
const sf=$("#sf");if(sf)sf.onsubmit=e=>{e.preventDefault();doSearch($("#q").value)};
on("#bk0",()=>{S.res=null;render()});on("#pv",()=>step(-1));on("#nx",()=>step(1));
const bk=$("#bk");if(bk)bk.onchange=()=>{S.book=bk.value;S.chap=1;S.hl="";loadChap()};
const cp=$("#cp");if(cp)cp.onchange=()=>{S.chap=+cp.value;S.hl="";loadChap()};
a.querySelectorAll(".rs").forEach(r=>{const go2=()=>{S.book=r.dataset.b;S.chap=+r.dataset.c;S.jump=+r.dataset.v;S.hl=S.q;S.q="";loadChap()};r.onclick=go2;r.onkeydown=e=>{if(e.key==="Enter")go2()}});
if(S.screen==="reg")initCb(a,d.country||"");
const f=$("#f");if(f){f.onsubmit=e=>{e.preventDefault();submit(a,st)}}}
const MAIL=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
async function submit(a,st){const v=id=>a.querySelector("#"+id),E={},clear=ks=>ks.forEach(k=>{const e=v("e-"+k);if(e)e.textContent=E[k]?t(E[k]):""});
st("");const email=v("email")?v("email").value.trim():"";
if(S.screen==="login"){if(!MAIL.test(email))E.email="eMail";if(!v("pw").value)E.pw="ePw";clear(["email","pw"]);if(Object.keys(E).length)return;
const {error}=await sb.auth.signInWithPassword({email,password:v("pw").value});if(error)st(t("bad"));return}
if(S.screen==="newpw"){if(v("pw").value.length<8){E.pw="ePw";clear(["pw"]);return}
const {error}=await sb.auth.updateUser({password:v("pw").value});if(error){st(t("fail"));return}st(t("done"));setTimeout(()=>enterBible(),900);return}
if(!v("name").value.trim())E.name="eName";if(!v("country").value)E.country="eCountry";
const ag=+v("age").value;if(!(ag>=1&&ag<=120))E.age="eAge";const sx=a.querySelector("input[name=sex]:checked");if(!sx)E.sex="eSex";const tel=v("tel").value.replace(/[\s.\-()]/g,"");if(tel&&!/^\d{4,14}$/.test(tel))E.tel="eTel";if(!MAIL.test(email))E.email="eMail";
if(v("pw").value.length<8)E.pw="ePw";if(!v("cgu").checked)E.cgu="eCgu";
clear(["name","country","age","sex","tel","email","pw","cgu"]);const first=Object.keys(E)[0];if(first){(first==="sex"?a.querySelector("input[name=sex]"):v(first==="country"?"cq":first)).focus();return}
const {data,error}=await sb.auth.signUp({email,password:v("pw").value,options:{emailRedirectTo:location.origin+location.pathname,data:{pseudo:v("name").value.trim(),country:v("country").value,age:ag,sex:sx.value,phone:tel?"+"+DC[v("country").value]+tel:""}}});
if(error){st(t("fail"));return}
if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){st(t("exists"));return}
try{localStorage.setItem("edsp_seen","1")}catch(e){}
if(!data.session){S.email=email;S.screen="check";render()}}
async function loadFav(){const {data}=await sb.from("favoris").select("ref");S.fav=(data||[]).map(r=>r.ref)}
render();
if(CFG)sb.auth.onAuthStateChange((ev,ses)=>setTimeout(async()=>{
if(ev==="PASSWORD_RECOVERY"){S.user=ses.user;S.screen="newpw";render();return}
if(ses){S.user=ses.user;await loadFav();if(S.screen!=="bible"&&S.screen!=="newpw"){if(seen(ses.user))enterBible();else{S.screen="welcome";render()}}}
else{S.user=null;S.fav=[];let seenAny=false;try{seenAny=!!localStorage.getItem("edsp_seen")}catch(e){}S.screen=seenAny?"login":"reg";render()}},0));
setTimeout(()=>{const s=document.getElementById("splash");s.style.opacity=0;setTimeout(()=>s.hidden=true,500)},1200);
</script>
</body>
