<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDSP-Sainte Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FA;--fg:#0B1F3A;--mut:#4A5873;--gold:#8A6D1B;--card:#FFFFFF;--line:#CBD2DE;--btn:#0B1F3A;--on:#FFFFFF;--err:#A3261F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F3A;--fg:#EEEADF;--mut:#A9B4C8;--gold:#D6B75C;--card:#12294A;--line:#2C4467;--btn:#D6B75C;--on:#0B1F3A;--err:#FF9B94;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1F3A;--fg:#EEEADF;--mut:#A9B4C8;--gold:#D6B75C;--card:#12294A;--line:#2C4467;--btn:#D6B75C;--on:#0B1F3A;--err:#FF9B94;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.serif{font-family:Newsreader,Georgia,"Times New Roman",serif}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
main.wide{max-width:42rem}
h1{font:600 1.9rem/1.2 Newsreader,Georgia,serif;margin:.25rem 0 .5rem}
p{margin:.25rem 0 1rem;color:var(--mut)}
.demo{border-left:3px solid var(--gold);padding:.5rem .75rem;font-size:.9rem;color:var(--mut);background:var(--card);margin:0 0 1.25rem}
label{display:block;font-weight:600;margin:1rem 0 .3rem}
.opt{font-weight:400;color:var(--mut)}
input,select{width:100%;min-height:2.75rem;padding:.5rem .7rem;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px}
input[type=checkbox]{width:1.2rem;min-height:0;height:1.2rem;margin:.15rem .6rem 0 0;flex:none}
.chk{display:flex;align-items:flex-start;font-weight:400;margin-top:1.25rem}
.err{color:var(--err);font-size:.88rem;min-height:1.1rem;margin-top:.25rem}
button{font:inherit;cursor:pointer}
.go{min-height:3rem;width:100%;margin-top:1.25rem;border:0;border-radius:6px;background:var(--btn);color:var(--on);font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B1F3A;color:#EEEADF;text-align:center;padding:2rem;z-index:5}
#splash h1{font-size:2.4rem;margin:0}
#splash i{display:block;width:4rem;height:2px;background:#D6B75C;margin:1rem 0}
#splash span{color:#A9B4C8}
.verse{border-left:3px solid var(--gold);padding:.25rem 0 .25rem 1.1rem;margin:1.5rem 0}
.verse q{display:block;font:italic 400 1.6rem/1.4 Newsreader,Georgia,serif;quotes:none}
.verse cite{display:block;margin-top:.5rem;color:var(--mut);font-style:normal}
header.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.6rem 1.25rem;background:var(--bg);border-bottom:1px solid var(--line)}
header.bar b{font:600 1.05rem Newsreader,Georgia,serif}
.tools button{min-width:2.5rem;min-height:2.5rem;margin-left:.25rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.sw{position:absolute;top:.9rem;right:1.25rem}
.sw button{min-height:2.25rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);padding:0 .7rem}
.v{display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.v .n{flex:none;width:2.2rem;color:var(--gold);font-weight:600;text-align:right}
.v .t{flex:1;font-family:Newsreader,Georgia,serif;line-height:1.6}
.v .f{flex:none;min-width:2.5rem;border:0;background:none;font-size:1.3rem;color:var(--gold)}
.reset{margin-top:2rem;background:none;border:0;color:var(--mut);text-decoration:underline}
@media (prefers-reduced-motion:no-preference){#splash{transition:opacity .5s}}
[hidden]{display:none!important}
.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:.5rem 0;margin-right:1rem}.ok{color:var(--fg);font-size:.95rem;min-height:1.2rem;margin-top:.75rem}
</style>
</head>
<body>
<div id="splash"><h1>EDSP-Sainte Bible</h1><i></i><span id="tag"></span></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURATION : adresse du projet et clé publique (anon), prévue pour être publique ===== */
const SB_URL="https://wkgbhmrfhvcljtvbocxu.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZ2JobXJmaHZjbGp0dmJvY3h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjUxMDYsImV4cCI6MjEwODgwMTEwNn0.vOMkUz5xHmfgO3ymDLZqSwYr7XIBDBetNUNSRp5exOs";
/* ================================================================================ */
const T={
fr:{tag:"Lire la Bible, simplement.",reg:"Créer votre compte",sub:"Une seule inscription, puis tout le contenu est à votre portée.",log:"Se connecter",logs:"Content de vous revoir.",name:"Nom ou pseudonyme",country:"Pays",pick:"Choisir un pays",age:"Âge",email:"Adresse e-mail",pw:"Mot de passe",pwh:"8 caractères minimum",tel:"Téléphone",opt:"facultatif",cgu:"J’accepte les conditions d’utilisation et la politique de confidentialité.",go:"S’inscrire",in:"Se connecter",eName:"Indiquez un nom ou un pseudonyme.",eCountry:"Choisissez votre pays.",eAge:"Indiquez un âge entre 1 et 120.",eMail:"Entrez une adresse e-mail valide.",ePw:"Le mot de passe doit contenir au moins 8 caractères.",eCgu:"Acceptez les conditions pour continuer.",bad:"Adresse ou mot de passe incorrect, ou adresse e-mail pas encore confirmée.",fail:"L’opération a échoué. Réessayez dans un instant.",chk:"Vérifiez votre boîte e-mail",chkp:"Un message de confirmation a été envoyé à ",chkq:". Cliquez sur le lien qu’il contient, puis connectez-vous.",toLog:"J’ai déjà un compte",toReg:"Créer un compte",forgot:"Mot de passe oublié",sent:"Si un compte existe pour cette adresse, un e-mail de réinitialisation vient d’être envoyé.",newpw:"Choisir un nouveau mot de passe",save:"Enregistrer",done:"Mot de passe modifié.",hi:"Bienvenue, ",enter:"Entrer dans la Bible",title:"Psaumes 119",ext:"Extrait : versets 102 à 105 (Louis Segond 1910). La Bible complète sera ajoutée ensuite.",srch:"Chercher un mot",none:"Aucun verset ne correspond.",fav:"Favori",out:"Se déconnecter",verse:"Ta parole est une lampe à mes pieds, Et une lumière sur mon sentier.",ref:"Psaume 119:105 · Louis Segond 1910",cfg:"Configuration manquante : renseignez l’adresse et la clé Supabase dans le fichier (voir le guide)."},
en:{tag:"Read the Bible, simply.",reg:"Create your account",sub:"Sign up once, then all content is within reach.",log:"Log in",logs:"Good to see you again.",name:"Name or nickname",country:"Country",pick:"Choose a country",age:"Age",email:"Email address",pw:"Password",pwh:"At least 8 characters",tel:"Phone",opt:"optional",cgu:"I accept the terms of use and the privacy policy.",go:"Sign up",in:"Log in",eName:"Enter a name or nickname.",eCountry:"Choose your country.",eAge:"Enter an age between 1 and 120.",eMail:"Enter a valid email address.",ePw:"The password must have at least 8 characters.",eCgu:"Accept the terms to continue.",bad:"Wrong email or password, or the email address is not confirmed yet.",fail:"The operation failed. Try again in a moment.",chk:"Check your inbox",chkp:"A confirmation message was sent to ",chkq:". Click the link inside, then log in.",toLog:"I already have an account",toReg:"Create an account",forgot:"Forgot password",sent:"If an account exists for this address, a reset email has just been sent.",newpw:"Choose a new password",save:"Save",done:"Password changed.",hi:"Welcome, ",enter:"Enter the Bible",title:"Psalm 119",ext:"Excerpt: verses 102 to 105 (King James Version; English translation still to be chosen). The full Bible will be added next.",srch:"Search a word",none:"No verse matches.",fav:"Favorite",out:"Log out",verse:"Thy word is a lamp unto my feet, and a light unto my path.",ref:"Psalm 119:105 · King James Version",cfg:"Missing configuration: set the Supabase address and key in the file (see the guide)."}};
const V=[[102,"Je ne m’écarte pas de tes lois, Car c’est toi qui m’enseignes.","I have not departed from thy judgments: for thou hast taught me."],[103,"Que tes paroles sont douces à mon palais, Plus que le miel à ma bouche !","How sweet are thy words unto my taste! yea, sweeter than honey to my mouth!"],[104,"Par tes ordonnances je deviens intelligent, Aussi je hais toute voie de mensonge.","Through thy precepts I get understanding: therefore I hate every false way."],[105,"Ta parole est une lampe à mes pieds, Et une lumière sur mon sentier.","Thy word is a lamp unto my feet, and a light unto my path."]];
const CFG=!SB_URL.startsWith("COLLER")&&!SB_KEY.startsWith("COLLER");
const sb=CFG?supabase.createClient(SB_URL,SB_KEY):null;
let S={lang:(navigator.language||"fr").slice(0,2)==="en"?"en":"fr",size:1.15,theme:"",q:"",screen:"login",user:null,fav:[],email:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("edsp_prefs")||"{}"))}catch(e){}
S.screen="login";S.user=null;S.fav=[];
const save=()=>{try{localStorage.setItem("edsp_prefs",JSON.stringify({lang:S.lang,size:S.size,theme:S.theme}))}catch(e){}};
const t=k=>T[S.lang][k];
const flag=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)));
const BAD="AC CP DG EA EU EZ IC TA UN XA XB ZZ QO AN".split(" ");
function countries(){const dn=new Intl.DisplayNames([S.lang],{type:"region",fallback:"none"}),o=[];
for(let a=65;a<91;a++)for(let b=65;b<91;b++){const c=String.fromCharCode(a,b);if(BAD.includes(c))continue;let n;try{n=dn.of(c)}catch(e){}if(n&&n!==c)o.push([c,n])}
return o.sort((x,y)=>x[1].localeCompare(y[1],S.lang))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const theme=()=>{const r=document.documentElement;S.theme?r.setAttribute("data-theme",S.theme):r.removeAttribute("data-theme")};
const sw=()=>`<div class="sw"><button id="lg" aria-label="Français / English">${S.lang==="fr"?"EN":"FR"}</button></div>`;
const draft=()=>{const d={};document.querySelectorAll("#f input:not([type=password]),#f select").forEach(e=>d[e.id]=e.type==="checkbox"?e.checked:e.value);return d};
const seen=u=>{try{return localStorage.getItem("welcomed_"+u.id)}catch(e){return 1}};
const field=(id,label,type,val,ac,extra="")=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" autocomplete="${ac}" value="${esc(val||"")}" ${extra}><div class="err" id="e-${id}" role="alert"></div>`;
function viewLogin(d){return `<main>${sw()}<h1>${t("log")}</h1><p>${t("logs")}</p><form id="f" novalidate>${field("email",t("email"),"email",d.email,"email")}${field("pw",t("pw"),"password","","current-password")}<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("in")}</button></form><button class="lnk" id="toReg">${t("toReg")}</button><button class="lnk" id="fg">${t("forgot")}</button></main>`}
function viewReg(d){const opts=countries().map(([c,n])=>`<option value="${c}" ${d.country===c?"selected":""}>${flag(c)} ${esc(n)}</option>`).join("");
return `<main>${sw()}<h1>${t("reg")}</h1><p>${t("sub")}</p><form id="f" novalidate>${field("name",t("name"),"text",d.name,"nickname")}
<label for="country">${t("country")}</label><select id="country" autocomplete="country"><option value="">${t("pick")}</option>${opts}</select><div class="err" id="e-country" role="alert"></div>
${field("age",t("age"),"number",d.age,"off",'inputmode="numeric" min="1" max="120"')}${field("email",t("email"),"email",d.email,"email")}${field("pw",`${t("pw")} <span class="opt">(${t("pwh")})</span>`,"password","","new-password")}
<label for="tel">${t("tel")} <span class="opt">(${t("opt")})</span></label><input id="tel" type="tel" autocomplete="tel" value="${esc(d.tel||"")}">
<label class="chk" for="cgu"><input id="cgu" type="checkbox" ${d.cgu?"checked":""}><span>${t("cgu")}</span></label><div class="err" id="e-cgu" role="alert"></div>
<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("go")}</button></form><button class="lnk" id="toLog">${t("toLog")}</button></main>`}
const viewCheck=()=>`<main>${sw()}<h1>${t("chk")}</h1><p>${t("chkp")}<b>${esc(S.email)}</b>${t("chkq")}</p><button class="lnk" id="toLog">${t("toLog")}</button></main>`;
const viewNew=()=>`<main>${sw()}<h1>${t("newpw")}</h1><form id="f" novalidate>${field("pw",t("pw")+` <span class="opt">(${t("pwh")})</span>`,"password","","new-password")}<div class="ok" id="st" role="status"></div><button class="go" type="submit">${t("save")}</button></form></main>`;
const viewWelcome=()=>`<main>${sw()}<h1>${t("hi")}${esc(S.user.user_metadata.pseudo||"")}</h1><div class="verse"><q>${t("verse")}</q><cite>${t("ref")}</cite></div><button class="go" id="enter">${t("enter")}</button></main>`;
function viewBible(){const q=S.q.trim().toLowerCase(),i=S.lang==="fr"?1:2,rows=V.filter(v=>!q||v[i].toLowerCase().includes(q));
return `<header class="bar"><b>EDSP-Sainte Bible</b><div class="tools"><button id="sm" aria-label="A−">A−</button><button id="bg" aria-label="A+">A+</button><button id="th" aria-label="Thème">◐</button><button id="lg" aria-label="Français / English">${S.lang==="fr"?"EN":"FR"}</button></div></header>
<main class="wide"><h1>${t("title")}</h1><p>${t("ext")}</p><label for="q" class="opt" style="margin-top:0">${t("srch")}</label><input id="q" type="search" value="${esc(S.q)}">
<div id="vs" style="font-size:${S.size}rem">${rows.length?rows.map(v=>{const on=S.fav.includes("PS.119."+v[0]);return `<div class="v"><span class="n">${v[0]}</span><span class="t">${esc(v[i])}</span><button class="f" data-v="${v[0]}" aria-pressed="${on}" aria-label="${t("fav")} ${v[0]}">${on?"★":"☆"}</button></div>`}).join(""):`<p>${t("none")}</p>`}</div>
<button class="reset" id="out">${t("out")}</button></main>`}
function render(d={}){theme();document.documentElement.lang=S.lang;document.getElementById("tag").textContent=t("tag");
const a=document.getElementById("app");
if(!CFG){a.innerHTML=`<main><h1>EDSP-Sainte Bible</h1><div class="err">${t("cfg")}</div></main>`;return}
const V2={login:viewLogin,reg:viewReg,check:viewCheck,newpw:viewNew,welcome:viewWelcome,bible:viewBible};
a.innerHTML=V2[S.screen](d);
const $=s=>a.querySelector(s),on=(s,f)=>{const e=$(s);if(e)e.onclick=f},st=m=>{const e=$("#st");if(e)e.textContent=m};
const go=s=>{S.screen=s;render();scrollTo(0,0)};
on("#lg",()=>{const d=$("#f")?draft():{};S.lang=S.lang==="fr"?"en":"fr";save();render(d)});
on("#toReg",()=>go("reg"));on("#toLog",()=>go("login"));
on("#enter",()=>{try{localStorage.setItem("welcomed_"+S.user.id,"1")}catch(e){}go("bible")});
on("#sm",()=>{S.size=Math.max(.9,S.size-.1);save();$("#vs").style.fontSize=S.size+"rem"});
on("#bg",()=>{S.size=Math.min(2,S.size+.1);save();$("#vs").style.fontSize=S.size+"rem"});
on("#th",()=>{const dk=matchMedia("(prefers-color-scheme: dark)").matches,cur=S.theme||(dk?"dark":"light");S.theme=cur==="dark"?"light":"dark";save();theme()});
on("#out",()=>sb.auth.signOut());
on("#fg",async()=>{const m=$("#email").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$("#e-email").textContent=t("eMail");return}
await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});st(t("sent"))});
a.querySelectorAll(".f").forEach(b=>b.onclick=async()=>{const ref="PS.119."+b.dataset.v,has=S.fav.includes(ref);
const r=has?await sb.from("favoris").delete().eq("user_id",S.user.id).eq("ref",ref):await sb.from("favoris").insert({user_id:S.user.id,ref});
if(r.error)return;S.fav=has?S.fav.filter(x=>x!==ref):[...S.fav,ref];b.setAttribute("aria-pressed",!has);b.textContent=has?"☆":"★"});
const q=$("#q");if(q)q.oninput=()=>{S.q=q.value;const p=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
const f=$("#f");if(f){if(d.country)$("#country").value=d.country;f.onsubmit=e=>{e.preventDefault();submit(a,st)}}}
const MAIL=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
async function submit(a,st){const v=id=>a.querySelector("#"+id),E={},clear=ks=>ks.forEach(k=>{const e=v("e-"+k);if(e)e.textContent=E[k]?t(E[k]):""});
st("");const email=v("email")?v("email").value.trim():"";
if(S.screen==="login"){if(!MAIL.test(email))E.email="eMail";if(!v("pw").value)E.pw="ePw";clear(["email","pw"]);if(Object.keys(E).length)return;
const {error}=await sb.auth.signInWithPassword({email,password:v("pw").value});if(error)st(t("bad"));return}
if(S.screen==="newpw"){if(v("pw").value.length<8){E.pw="ePw";clear(["pw"]);return}
const {error}=await sb.auth.updateUser({password:v("pw").value});if(error){st(t("fail"));return}st(t("done"));setTimeout(()=>{S.screen="bible";render()},900);return}
if(!v("name").value.trim())E.name="eName";if(!v("country").value)E.country="eCountry";
const ag=+v("age").value;if(!(ag>=1&&ag<=120))E.age="eAge";if(!MAIL.test(email))E.email="eMail";
if(v("pw").value.length<8)E.pw="ePw";if(!v("cgu").checked)E.cgu="eCgu";
clear(["name","country","age","email","pw","cgu"]);const first=Object.keys(E)[0];if(first){v(first).focus();return}
const {data,error}=await sb.auth.signUp({email,password:v("pw").value,options:{emailRedirectTo:location.origin+location.pathname,data:{pseudo:v("name").value.trim(),country:v("country").value,age:ag,phone:v("tel").value.trim()}}});
if(error){st(t("fail"));return}
try{localStorage.setItem("edsp_seen","1")}catch(e){}
if(!data.session){S.email=email;S.screen="check";render()}}
async function loadFav(){const {data}=await sb.from("favoris").select("ref");S.fav=(data||[]).map(r=>r.ref)}
render();
if(CFG)sb.auth.onAuthStateChange((ev,ses)=>setTimeout(async()=>{
if(ev==="PASSWORD_RECOVERY"){S.user=ses.user;S.screen="newpw";render();return}
if(ses){S.user=ses.user;await loadFav();if(S.screen!=="bible"&&S.screen!=="newpw"){S.screen=seen(ses.user)?"bible":"welcome";render()}}
else{S.user=null;S.fav=[];let seenAny=false;try{seenAny=!!localStorage.getItem("edsp_seen")}catch(e){}S.screen=seenAny?"login":"reg";render()}},0));
setTimeout(()=>{const s=document.getElementById("splash");s.style.opacity=0;setTimeout(()=>s.hidden=true,500)},1200);
</script>
</body>
</html>
